<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation: Holographic Foam & Positional Uncertainty</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --header-color: #ffffff;
            --primary-color: #2196f3; /* Blue for holography/information */
            --secondary-color: #f44336;
            --accent-color: #ffeb3b;
            --border-color: #444;
            --panel-bg-color: #2a2a2a;
            --control-bg-color: #333;
            --font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-family); line-height: 1.6; margin: 0; padding: 0; font-size: 16px; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid var(--border-color); }
        h1 { color: var(--header-color); font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { font-size: 1.2em; color: var(--primary-color); margin-bottom: 15px; }
        main { display: grid; grid-template-columns: 1fr 400px; gap: 20px; margin-top: 20px; }
        .simulation-column { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .controls-column { background-color: var(--panel-bg-color); padding: 15px; border-radius: 8px; height: fit-content; }
        .panel { background-color: var(--panel-bg-color); padding: 20px; border-radius: 8px; }
        .panel h2, .controls-column h2 { color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 0; }
        canvas { width: 100%; height: auto; background-color: #000; border-radius: 8px; aspect-ratio: 1; }
        .control-group { margin-bottom: 20px; }
        .control-group h3 { color: var(--accent-color); font-size: 1.1em; margin-bottom: 10px; }
        .control { margin-bottom: 15px; }
        .control label { display: block; font-size: 0.9em; margin-bottom: 5px; }
        .control input { width: 100%; }
        .control-readout { font-size: 0.9em; color: #ccc; }
        .exposition { grid-column: 1 / -1; }
        button { background-color: var(--primary-color); color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Holographic Foam & Positional Uncertainty</h1>
            <p class="subtitle">A simulation of the fundamental "jitter" predicted by the holographic principle.</p>
        </header>

        <main>
            <div class="simulation-column">
                <div class="panel">
                    <h2>Telescope View of Distant Quasar</h2>
                    <canvas id="main-canvas"></canvas>
                </div>
                <div class="panel">
                    <h2>History of Apparent Positions</h2>
                    <canvas id="history-canvas"></canvas>
                </div>
            </div>

            <div class="controls-column">
                <h2>Controls</h2>
                <div class="control-group">
                    <h3>Simulation</h3>
                    <button id="reset-btn">Reset</button>
                </div>
                <div class="control-group">
                    <h3>Physics Parameters</h3>
                    <div class="control">
                        <label for="uncertainty">Holographic Uncertainty</label>
                        <input type="range" id="uncertainty" min="0" max="10" step="0.5" value="2.0">
                        <span class="control-readout" id="uncertainty-readout">2.0</span>
                    </div>
                </div>
                 <div class="control-group">
                    <h3>Metrics</h3>
                    <div class="control-readout">Total Positions Logged: <span id="metric-history">0</span></div>
                </div>
            </div>

            <div class="exposition container">
                 <!-- Exposition -->
            </div>
        </main>
    </div>

    <script>
    (function() {
        'use strict';
        // --- STATE & CONFIG ---
        let state = {};

        // --- DOM ELEMENTS ---
        let mainCanvas, mainCtx, historyCanvas, historyCtx;
        let controls = {};
        let metrics = {};

        // --- SIMULATION LOGIC ---

        // Standard Normal variate using Box-Muller transform.
        // Provides a more realistic "noise" than Math.random().
        function gaussianRandom() {
            let u = 0, v = 0;
            while(u === 0) u = Math.random(); //Converting [0,1) to (0,1)
            while(v === 0) v = Math.random();
            return Math.sqrt( -2.0 * Math.log( u ) ) * Math.cos( 2.0 * Math.PI * v );
        }

        function initialize() {
            state = {
                quasar_true_pos: { x: mainCanvas.width / 2, y: mainCanvas.height / 2 },
                quasar_jitter: { x: 0, y: 0 },
                history: [],
            };
        }

        function updateSimulation() {
            const amplitude = parseFloat(controls.uncertainty.value);

            // The entire "physics" of this simulation is just generating
            // a new random jitter in each frame. This is simple and robust.
            state.quasar_jitter.x = gaussianRandom() * amplitude;
            state.quasar_jitter.y = gaussianRandom() * amplitude;

            // Log the apparent position for the history chart
            if (state.history.length > 5000) {
                state.history.shift();
            }
            state.history.push({
                x: state.quasar_true_pos.x + state.quasar_jitter.x,
                y: state.quasar_true_pos.y + state.quasar_jitter.y,
            });
        }

        // --- RENDERING ---
        function draw() {
            requestAnimationFrame(draw);
            updateSimulation();

            drawMainView();
            drawHistoryView();
            updateMetricsUI();
        }

        function drawMainView() {
            mainCtx.fillStyle = '#000';
            mainCtx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);

            const apparent_x = state.quasar_true_pos.x + state.quasar_jitter.x;
            const apparent_y = state.quasar_true_pos.y + state.quasar_jitter.y;

            // Draw a "star" with a glowing halo
            const grad = mainCtx.createRadialGradient(apparent_x, apparent_y, 0, apparent_x, apparent_y, 20);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.2, 'rgba(255, 255, 200, 0.8)');
            grad.addColorStop(1, 'rgba(255, 255, 200, 0)');

            mainCtx.fillStyle = grad;
            mainCtx.beginPath();
            mainCtx.arc(apparent_x, apparent_y, 20, 0, 2 * Math.PI);
            mainCtx.fill();
        }

        function drawHistoryView() {
            historyCtx.fillStyle = 'rgba(0, 0, 0, 0.05)'; // Fade old points slowly
            historyCtx.fillRect(0, 0, historyCanvas.width, historyCanvas.height);

            historyCtx.fillStyle = 'rgba(255, 255, 0, 0.5)';

            // Draw the most recent point in the history
            if (state.history.length > 0) {
                const lastPoint = state.history[state.history.length - 1];
                historyCtx.beginPath();
                historyCtx.arc(lastPoint.x, lastPoint.y, 1, 0, 2 * Math.PI);
                historyCtx.fill();
            }
        }

        function updateMetricsUI() {
            metrics.history.textContent = state.history.length;
            document.getElementById('uncertainty-readout').textContent = controls.uncertainty.value;
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            mainCanvas = document.getElementById('main-canvas');
            mainCtx = mainCanvas.getContext('2d');
            historyCanvas = document.getElementById('history-canvas');
            historyCtx = historyCanvas.getContext('2d');

            mainCanvas.width = mainCanvas.height = 400;
            historyCanvas.width = historyCanvas.height = 400;

            controls.uncertainty = document.getElementById('uncertainty');
            metrics.history = document.getElementById('metric-history');

            document.getElementById('reset-btn').addEventListener('click', () => {
                // Clear the history canvas on reset
                historyCtx.fillStyle = '#000';
                historyCtx.fillRect(0,0,historyCanvas.width, historyCanvas.height);
                initialize();
            });

            initialize();
            draw();
        });
    })();
    </script>
</body>
</html>
