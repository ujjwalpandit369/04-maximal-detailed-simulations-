        const { state, params } = this;
        state.t += dt;

        // Decoherence model: exponential decay of off-diagonal terms
        const decoherence_rate = params.coupling * Math.pow(params.separation, 2);
        const decay_factor = Math.exp(-decoherence_rate * dt);

        state.rho[1] *= decay_factor; // rho_LR
        state.rho[2] *= decay_factor; // rho_RL
    }
