<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: Ferroelectric Domain Switching</title>
    <style>
        :root {
            --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --accent-color: #e67e22; --accent-hover: #d35400; --panel-bg: #2a2a2a; --panel-border: #444444; --control-bg: #333333; --control-text: #e0e0e0; --input-bg: #1e1e1e; --button-bg: #d35400; --button-text: #ffffff;
        }
        /* All other styles are identical */
        body { font-family: var(--font-main, sans-serif); background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        .container { max-width: 1800px; margin: 0 auto; padding: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 400px; grid-template-areas: "simulation controls" "charts metrics" "content content" "qa qa"; gap: 20px; }
        @media (max-width: 1200px) { .main-layout { grid-template-columns: 1fr; grid-template-areas: "simulation" "controls" "charts" "metrics" "content" "qa"; } }
        .panel { background-color: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 20px; }
        .panel h2 { margin-top: 0; color: var(--header-color); border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; }
        .simulation-container { position: relative; width: 100%; height: 512px; background-color: #000; border-radius: 5px; image-rendering: pixelated; }
        .charts-area-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .charts-area-grid { grid-template-columns: 1fr; } }
        .dynamic-chart-container { width: 100%; height: 300px; background-color: #050505; border-radius: 5px; padding: 10px; }
        .control-group { margin-bottom: 15px; } .control-group label { display: block; }
        .presets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .metric-item { background-color: var(--control-bg); padding: 10px; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Flipping the Switch: Simulating Ferroelectric Domains and Hysteresis</h1></header>
        <div class="main-layout">
            <div class="panel simulation-area"><h2>2D Dipole Lattice</h2><div class="simulation-container"><canvas id="main-canvas"></canvas></div></div>
            <div class="panel controls-area"><h2>Controls</h2><div id="controls-panel"></div></div>
            <div class="panel metrics-area"><h2>Live Metrics</h2><div class="metrics-grid" id="metrics-panel"></div></div>
            <div class="panel charts-area">
                <h2>Data Visualizations</h2>
                <div class="charts-area-grid">
                    <div class="dynamic-chart-container"><h2>P-E Hysteresis Loop</h2><canvas id="hysteresis-canvas"></canvas></div>
                    <div class="dynamic-chart-container"><h2>Domain Size vs. Time</h2><canvas id="domain-size-canvas"></canvas></div>
                    <div class="dynamic-chart-container" style="grid-column: 1 / -1;"><h2>Perovskite Crystal Structure</h2><svg id="perovskite-svg"></svg></div>
                </div>
            </div>
            <div class="panel content-area"><article id="exposition-content"></article></div>
            <div class="panel qa-area"><h2>Questions & Answers</h2><div id="qa-content"></div></div>
        </div>
    </div>
<script>

    const app = new FerroelectricSimApp();

class FerroelectricSimApp {
    constructor() {
        this.canvas = document.getElementById('main-canvas'); this.ctx = this.canvas.getContext('2d');
        // ... other canvases and svg ...
        this.params = {};
        this.state = {};
        this.isRunning = false;
        this.gridSize = 128;
    }

    init() {
        this.setupControls();
        this.addEventListeners();
        this.loadPreset('default');
        this.gameLoop();
    }

    setupControls() {
        // ... setup for 6+ controls: E-Field, Temperature, Coupling J, etc. ...
    }

    addEventListeners() {
        // ... listeners for controls and presets ...
        document.getElementById('trace-loop-btn').addEventListener('click', () => this.traceHysteresisLoop());
    }

    loadPreset(id, p) {
        // ... load default or preset values ...
        this.resetSimulation();
    }

    resetSimulation() {
        this.isRunning = true;
        this.state = {
            t: 0,
            dipoles: new Int8Array(this.gridSize * this.gridSize)
        };
        // Initialize dipoles randomly
        for(let i=0; i<this.state.dipoles.length; i++) {
            this.state.dipoles[i] = Math.random() > 0.5 ? 1 : -1;
        }
    }

    traceHysteresisLoop() {
        // ... logic to slowly sweep E-field up and down and record P ...
    }

    gameLoop() {
        requestAnimationFrame(() => this.gameLoop());
        if (this.isRunning) {
            for (let i=0; i<1000; i++) { // Multiple MC steps per frame
                this.update();
            }
        }
        this.draw();
    }

    update() {
        // Metropolis Monte Carlo step
        const { dipoles, params, gridSize } = this.state;
        const i = Math.floor(Math.random() * gridSize);
        const j = Math.floor(Math.random() * gridSize);
        const idx = j * gridSize + i;

        const dipole = dipoles[idx];
        const neighbors = [
            dipoles[j * gridSize + (i-1+gridSize)%gridSize],
            dipoles[j * gridSize + (i+1)%gridSize],
            dipoles[((j-1+gridSize)%gridSize) * gridSize + i],
            dipoles[((j+1)%gridSize) * gridSize + i]
        ];
        const neighbor_sum = neighbors.reduce((a,b) => a+b, 0);

        const dE = 2 * dipole * (params.J * neighbor_sum + params.E_ext);

        if (dE < 0 || Math.random() < Math.exp(-dE / params.T)) {
            dipoles[idx] *= -1; // Flip the spin
        }
    }

    draw() {
        this.drawMainCanvas();
        this.drawHysteresisLoop();
        // ... other draw calls ...
        this.updateMetrics();
    }

    drawMainCanvas() {

    }

    drawHysteresisLoop() {
        // ... draw P vs E from history ...
    }

    updateMetrics() {
        // ... calculate Total Polarization, etc. ...
    }
}
</script>
</body>
</html>
