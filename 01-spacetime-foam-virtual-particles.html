<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation: Spacetime Foam & Virtual Particles</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --header-color: #ffffff;
            --primary-color: #f39c12; /* Orange for energy/fluctuations */
            --secondary-color: #3498db;
            --accent-color: #9b59b6;
            --border-color: #444;
            --panel-bg-color: #2a2a2a;
            --control-bg-color: #333;
            --font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-family); line-height: 1.6; margin: 0; padding: 0; font-size: 16px; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid var(--border-color); }
        h1 { color: var(--header-color); font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { font-size: 1.2em; color: var(--primary-color); margin-bottom: 15px; }
        main { display: grid; grid-template-columns: 1fr 400px; gap: 20px; margin-top: 20px; }
        .simulation-column { display: flex; flex-direction: column; gap: 20px; }
        .controls-column { background-color: var(--panel-bg-color); padding: 15px; border-radius: 8px; height: fit-content; }
        .panel { background-color: var(--panel-bg-color); padding: 20px; border-radius: 8px; }
        .panel h2, .controls-column h2 { color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 0; }
        canvas { width: 100%; height: auto; background-color: #000; border-radius: 8px; aspect-ratio: 16/9; }
        .control-group { margin-bottom: 20px; }
        .control-group h3 { color: var(--accent-color); font-size: 1.1em; margin-bottom: 10px; }
        .control { margin-bottom: 15px; }
        .control label { display: block; font-size: 0.9em; margin-bottom: 5px; }
        .control input { width: 100%; }
        .control-readout { font-size: 0.9em; color: #ccc; }
        .exposition { grid-column: 1 / -1; }
        button { background-color: var(--primary-color); color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Spacetime Foam: Virtual Particles</h1>
            <p class="subtitle">Visualizing the energy fluctuations of the quantum vacuum.</p>
        </header>

        <main>
            <div class="simulation-column">
                <div class="panel">
                    <canvas id="main-canvas"></canvas>
                </div>
            </div>

            <div class="controls-column">
                <h2>Controls</h2>
                <div class="control-group">
                    <h3>Simulation</h3>
                    <button id="start-stop-btn">Pause</button>
                    <button id="reset-btn">Reset</button>
                </div>
                <div class="control-group">
                    <h3>Physics Parameters</h3>
                    <div class="control">
                        <label for="creation-rate">Creation Rate</label>
                        <input type="range" id="creation-rate" min="1" max="20" step="1" value="10">
                        <span class="control-readout" id="creation-rate-readout">10</span>
                    </div>
                    <div class="control">
                        <label for="hbar">Effective Planck Constant (ħ)</label>
                        <input type="range" id="hbar" min="1" max="20" step="1" value="5">
                        <span class="control-readout" id="hbar-readout">5</span>
                    </div>
                </div>
                <div class="control-group">
                    <h3>Metrics</h3>
                    <div class="control-readout">Time: <span id="metric-time">0.0</span> s</div>
                    <div class="control-readout">Virtual Particle Count: <span id="metric-particles">0</span></div>
                </div>
            </div>

            <div class="exposition container">
                 <!-- Exposition -->
            </div>
        </main>
    </div>

    <script>
    (function() {
        'use strict';
        // --- STATE & CONFIG ---
        let state = {};
        let simRunning = true;

        // --- DOM ELEMENTS ---
        let canvas, ctx;
        let controls = {};
        let metrics = {};

        // --- SIMULATION LOGIC ---
        function initialize() {
            state = {
                time: 0,
                particles: [],
            };
            simRunning = true;
        }

        function updateSimulation(dt) {
            if (!simRunning) return;
            state.time += dt;

            // --- 1. Annihilate old particles ---
            // Filter out particles whose lifetime has expired.
            // We do this first to avoid drawing particles that are about to disappear.
            state.particles = state.particles.filter(p => {
                return state.time < (p.creationTime + p.lifetime);
            });

            // --- 2. Create new particles ---
            const creationRate = parseFloat(controls.creationRate.value);
            // The number of creation attempts per frame depends on the rate.
            for (let i = 0; i < creationRate; i++) {
                // We'll use a probability check for each attempt.
                if (Math.random() < 0.1) { // 10% chance per attempt
                    const energy = 1 + Math.random() * 100; // Random energy
                    const hbar = parseFloat(controls.hbar.value);

                    // From the Uncertainty Principle: delta_t ~ hbar / delta_E
                    // This is the core physical principle of the simulation.
                    const lifetime = hbar / energy;

                    state.particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        energy: energy,
                        creationTime: state.time,
                        lifetime: lifetime,
                        // For drawing the pair
                        angle: Math.random() * 2 * Math.PI,
                        separation: 2 + Math.random() * 5
                    });
                }
            }
        }

        // --- RENDERING ---
        function draw() {
            requestAnimationFrame(draw);
            const dt = 1/60.0;
            updateSimulation(dt);

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw all current virtual particles
            state.particles.forEach(p => {
                // Calculate opacity based on lifetime to fade in and out smoothly
                const age = state.time - p.creationTime;
                const lifeFraction = age / p.lifetime;
                // Use a sine wave for a smooth fade in and out
                const alpha = Math.sin(lifeFraction * Math.PI);

                // Color is based on energy (blue = low, red = high)
                const hue = 240 - (p.energy / 101) * 240;

                ctx.fillStyle = `hsla(${hue}, 100%, 70%, ${alpha})`;

                // Draw the particle-antiparticle pair
                const p1x = p.x + Math.cos(p.angle) * p.separation;
                const p1y = p.y + Math.sin(p.angle) * p.separation;
                const p2x = p.x - Math.cos(p.angle) * p.separation;
                const p2y = p.y - Math.sin(p.angle) * p.separation;

                const radius = 1 + p.energy / 50;

                ctx.beginPath();
                ctx.arc(p1x, p1y, radius, 0, 2 * Math.PI);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(p2x, p2y, radius, 0, 2 * Math.PI);
                ctx.fill();
            });

            updateMetricsUI();
        }

        function updateMetricsUI() {
            metrics.time.textContent = state.time.toFixed(2);
            metrics.particles.textContent = state.particles.length;
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('main-canvas');
            ctx = canvas.getContext('2d');
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            controls.creationRate = document.getElementById('creation-rate');
            controls.hbar = document.getElementById('hbar');

            metrics.time = document.getElementById('metric-time');
            metrics.particles = document.getElementById('metric-particles');

            document.getElementById('reset-btn').addEventListener('click', initialize);
            document.getElementById('start-stop-btn').addEventListener('click', () => { simRunning = !simRunning; });

            window.addEventListener('resize', () => {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
            });

            initialize();
            draw();
        });
    })();
    </script>
</body>
</html>
