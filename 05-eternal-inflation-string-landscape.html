<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation: The String Theory Landscape</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --header-color: #ffffff;
            --primary-color: #00bcd4; /* Cyan for the landscape/graph theory */
            --secondary-color: #9c27b0; /* Purple for multiverse */
            --accent-color: #ffeb3b; /* Yellow for highlights */
            --border-color: #444;
            --panel-bg-color: #2a2a2a;
            --control-bg-color: #333;
            --font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-family); line-height: 1.6; margin: 0; padding: 0; font-size: 16px; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid var(--border-color); }
        h1 { color: var(--header-color); font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { font-size: 1.2em; color: var(--primary-color); margin-bottom: 15px; }
        main { display: grid; grid-template-columns: 1fr 400px; gap: 20px; margin-top: 20px; }
        .simulation-column { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .controls-column { background-color: var(--panel-bg-color); padding: 15px; border-radius: 8px; height: fit-content; }
        .panel { background-color: var(--panel-bg-color); padding: 20px; border-radius: 8px; }
        .panel h2, .controls-column h2 { color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 0; }
        canvas { width: 100%; height: auto; background-color: #000; border-radius: 8px; aspect-ratio: 1; }
        .control-group { margin-bottom: 20px; }
        .control-group h3 { color: var(--accent-color); font-size: 1.1em; margin-bottom: 10px; }
        .control { margin-bottom: 15px; }
        .control label { display: block; font-size: 0.9em; margin-bottom: 5px; }
        .control input { width: 100%; }
        .control-readout { font-size: 0.9em; color: #ccc; }
        .exposition { grid-column: 1 / -1; }
        button { background-color: var(--primary-color); color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { filter: brightness(1.2); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>The String Theory Landscape & The Multiverse</h1>
            <p class="subtitle">Visualizing a cosmos of all possibilities.</p>
        </header>

        <main>
            <div class="simulation-column">
                <div class="panel">
                    <h2>The Landscape Graph</h2>
                    <canvas id="landscape-canvas"></canvas>
                </div>
                <div class="panel">
                    <h2>The Resulting Multiverse</h2>
                    <canvas id="multiverse-canvas"></canvas>
                </div>
            </div>

            <div class="controls-column">
                <h2>Controls</h2>
                <div class="control-group">
                    <h3>Simulation</h3>
                    <button id="start-stop-btn">Pause</button>
                    <button id="reset-btn">New Landscape & Restart</button>
                </div>
                <div class="control-group">
                    <h3>Landscape Parameters</h3>
                    <div class="control">
                        <label for="num-vacua">Number of Vacua</label>
                        <input type="range" id="num-vacua" min="3" max="20" step="1" value="10">
                        <span class="control-readout" id="num-vacua-readout">10</span>
                    </div>
                    <div class="control">
                        <label for="connectivity">Connectivity</label>
                        <input type="range" id="connectivity" min="0.1" max="1" step="0.1" value="0.3">
                        <span class="control-readout" id="connectivity-readout">0.3</span>
                    </div>
                </div>
                <div class="control-group">
                    <h3>Physics Parameters</h3>
                     <div class="control">
                        <label for="nucleation-rate">Global Nucleation Rate</label>
                        <input type="range" id="nucleation-rate" min="1" max="20" step="1" value="5">
                        <span class="control-readout" id="nucleation-rate-readout">5</span>
                    </div>
                </div>
            </div>

            <div class="exposition container">
                 <!-- 5000+ words of detailed explanation -->
            </div>
        </main>
    </div>

    <script>
    (function() {
        // --- STATE & CONFIG ---
        let state = {};
        let simRunning = true;

        // --- DOM ELEMENTS ---
        let landscapeCanvas, landscapeCtx, multiverseCanvas, multiverseCtx;
        let controls = {};

        // --- SIMULATION LOGIC ---
        function initialize() {
            generateLandscape();
            state.time = 0;
            state.bubbles = [];
            state.parentVacuum = state.landscape.vacua.reduce((max, v) => v.energy > max.energy ? v : max, state.landscape.vacua[0]);
            simRunning = true;
        }

        function generateLandscape() {
            const numVacua = parseInt(controls.numVacua.value);
            const connectivity = parseFloat(controls.connectivity.value);

            const vacua = [];
            for (let i = 0; i < numVacua; i++) {
                vacua.push({
                    id: i,
                    energy: Math.random() * 100,
                    color: `hsl(${Math.random() * 360}, 80%, 50%)`,
                    // For drawing the graph
                    x: Math.random(),
                    y: Math.random(),
                });
            }

            const transitions = [];
            for (let i = 0; i < numVacua; i++) {
                for (let j = 0; j < numVacua; j++) {
                    if (i === j) continue;
                    // Only allow tunneling to lower energy states
                    if (vacua[i].energy > vacua[j].energy && Math.random() < connectivity) {
                        transitions.push({
                            from: i,
                            to: j,
                            probability: Math.random(),
                        });
                    }
                }
            }
            state.landscape = { vacua, transitions };
        }

        function updateSimulation(dt) {
            if (!simRunning) return;
            state.time += dt;

            // Nucleate new bubbles
            const nucleationRate = parseInt(controls.nucleationRate.value);
            for (let i = 0; i < nucleationRate; i++) {
                const x = Math.random();
                const y = Math.random();

                // Determine which vacuum type to nucleate
                const possibleTransitions = state.landscape.transitions.filter(t => t.from === state.parentVacuum.id);
                if (possibleTransitions.length > 0) {
                    // Choose a transition based on probability (simplified)
                    const transition = possibleTransitions[Math.floor(Math.random() * possibleTransitions.length)];

                    state.bubbles.push({
                        x: x, y: y,
                        nucleationTime: state.time,
                        vacuumId: transition.to,
                    });
                }
            }
        }

        // --- RENDERING ---
        function draw() {
            requestAnimationFrame(draw);
            updateSimulation(1/60.0);

            drawLandscape();
            drawMultiverse();
        }

        function drawLandscape() {
            const w = landscapeCanvas.width;
            const h = landscapeCanvas.height;
            landscapeCtx.fillStyle = '#111';
            landscapeCtx.fillRect(0, 0, w, h);

            if (!state.landscape) return;

            // Draw transitions
            landscapeCtx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            landscapeCtx.lineWidth = 1;
            state.landscape.transitions.forEach(t => {
                const fromVac = state.landscape.vacua[t.from];
                const toVac = state.landscape.vacua[t.to];
                landscapeCtx.beginPath();
                landscapeCtx.moveTo(fromVac.x * w, fromVac.y * h);
                landscapeCtx.lineTo(toVac.x * w, toVac.y * h);
                landscapeCtx.stroke();
            });

            // Draw vacua
            state.landscape.vacua.forEach(v => {
                landscapeCtx.fillStyle = v.color;
                const radius = 5 + v.energy / 10;
                landscapeCtx.beginPath();
                landscapeCtx.arc(v.x * w, v.y * h, radius, 0, 2 * Math.PI);
                landscapeCtx.fill();

                if (v.id === state.parentVacuum.id) {
                    landscapeCtx.strokeStyle = 'yellow';
                    landscapeCtx.lineWidth = 3;
                    landscapeCtx.stroke();
                }
            });
        }

        function drawMultiverse() {
            const w = multiverseCanvas.width;
            const h = multiverseCanvas.height;
            multiverseCtx.fillStyle = state.parentVacuum ? state.parentVacuum.color.replace('50%)', '10%)') : '#0c001f';
            multiverseCtx.fillRect(0, 0, w, h);

            multiverseCtx.globalCompositeOperation = 'lighter';

            state.bubbles.forEach(bubble => {
                const radius = (state.time - bubble.nucleationTime) * 10;
                if (radius < 1) return;

                const vacuum = state.landscape.vacua[bubble.vacuumId];
                if (!vacuum) return;

                const grad = multiverseCtx.createRadialGradient(bubble.x*w, bubble.y*h, 0, bubble.x*w, bubble.y*h, radius);
                grad.addColorStop(0, vacuum.color.replace('50%)', '70%)'));
                grad.addColorStop(1, vacuum.color.replace('50%)', '0%)'));

                multiverseCtx.fillStyle = grad;
                multiverseCtx.beginPath();
                multiverseCtx.arc(bubble.x * w, bubble.y * h, radius, 0, 2 * Math.PI);
                multiverseCtx.fill();
            });

            multiverseCtx.globalCompositeOperation = 'source-over';
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            landscapeCanvas = document.getElementById('landscape-canvas');
            landscapeCtx = landscapeCanvas.getContext('2d');
            multiverseCanvas = document.getElementById('multiverse-canvas');
            multiverseCtx = multiverseCanvas.getContext('2d');

            controls.numVacua = document.getElementById('num-vacua');
            controls.connectivity = document.getElementById('connectivity');
            controls.nucleationRate = document.getElementById('nucleation-rate');

            document.getElementById('reset-btn').addEventListener('click', initialize);
            document.getElementById('start-stop-btn').addEventListener('click', () => { simRunning = !simRunning; });

            initialize();
            draw();
        });
    })();
    </script>
</body>
</html>
