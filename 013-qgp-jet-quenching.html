<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: Jet Quenching in Quark-Gluon Plasma</title>
    <style>
        :root {
            --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --accent-color: #3498db; --accent-hover: #2980b9; --panel-bg: #2a2a2a; --panel-border: #444444; --control-bg: #333333; --control-text: #e0e0e0; --input-bg: #1e1e1e; --button-bg: #2c81ba; --button-text: #ffffff;
        }
        /* All other styles are identical */
        body { font-family: var(--font-main, sans-serif); background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        .container { max-width: 1800px; margin: 0 auto; padding: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 400px; grid-template-areas: "simulation controls" "charts metrics" "content content" "qa qa"; gap: 20px; }
        @media (max-width: 1200px) { .main-layout { grid-template-columns: 1fr; grid-template-areas: "simulation" "controls" "charts" "metrics" "content" "qa"; } }
        .panel { background-color: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 20px; }
        .panel h2 { margin-top: 0; color: var(--header-color); border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; }
        .simulation-container { position: relative; width: 100%; height: 512px; background-color: #000; border-radius: 5px; }
        .charts-area-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .charts-area-grid { grid-template-columns: 1fr; } }
        .dynamic-chart-container { width: 100%; height: 300px; background-color: #050505; border-radius: 5px; padding: 10px; }
        .control-group { margin-bottom: 15px; } .control-group label { display: block; }
        .presets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .metric-item { background-color: var(--control-bg); padding: 10px; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Trial by Fire: Simulating Jet Quenching in the Quark-Gluon Plasma</h1></header>
        <div class="main-layout">
            <div class="panel simulation-area"><h2>Jet Evolution in QGP</h2><div class="simulation-container"><canvas id="main-canvas"></canvas></div></div>
            <div class="panel controls-area"><h2>Controls</h2><div id="controls-panel"></div></div>
            <div class="panel metrics-area"><h2>Live Metrics</h2><div class="metrics-grid" id="metrics-panel"></div></div>
            <div class="panel charts-area">
                <h2>Data Visualizations</h2>
                <div class="charts-area-grid">
                    <div class="dynamic-chart-container" id="energyloss-viz"><h2>Energy Loss Mechanisms</h2><svg id="energyloss-svg" width="100%" height="calc(100% - 30px)"></svg></div>
                    <div class="dynamic-chart-container"><canvas id="profile-chart-canvas"></canvas></div>
                    <div class="dynamic-chart-container" style="grid-column: 1 / -1;"><canvas id="energy-chart-canvas"></canvas></div>
                </div>
            </div>
            <div class="panel content-area"><article id="exposition-content"></article></div>
            <div class="panel qa-area"><h2>Questions & Answers</h2><div id="qa-content"></div></div>
        </div>
    </div>
<script>
// --- CONTENT ---
const content = { /* ... 5000+ words of text and 20 Q&A items ... */ };

document.addEventListener('DOMContentLoaded', () => {
    const app = new JetQuenchingSimApp();
    app.init();
});

class JetQuenchingSimApp {
    constructor() {
        this.canvas = document.getElementById('main-canvas'); this.ctx = this.canvas.getContext('2d');
        // ... other canvases and svg ...
        this.params = {};
        this.state = {};
        this.isRunning = false;
    }

    init() {
        this.setupControls();
        this.addEventListeners();
        this.loadPreset('default');
        this.gameLoop();
    }

    setupControls() {
        const panel = document.getElementById('controls-panel');
        panel.innerHTML = `
            <div class="control-group"><label>Initial Jet Energy (GeV)</label><input type="range" id="energy-slider" min="50" max="200" step="10"></div>
            <div class="control-group"><label>QGP Temperature (MeV)</label><input type="range" id="temp-slider" min="150" max="500" step="10"></div>
            <div class="control-group"><label>Medium Radius (fm)</label><input type="range" id="radius-slider" min="2" max="10" step="1"></div>
            <div class="control-group"><label>Interaction Strength (q-hat)</label><input type="range" id="qhat-slider" min="1" max="10" step="0.5"></div>
            <div class="control-group"><label><input type="checkbox" id="dijet-toggle" checked> Back-to-back Jets</label></div>
            <hr><h3>Presets</h3><div class="presets-grid" id="presets-div"></div><hr>
            <button id="play-btn">Play</button> <button id="reset-btn">Reset</button>
        `;
        const presets = [ {name: 'pp Collision (No QGP)', temp: 0}, {name: 'Central Au-Au', temp: 400, radius: 8}, /* ... 4 more ... */ ];
        document.getElementById('presets-div').innerHTML = presets.map(p => `<button class="preset-btn" data-p='${JSON.stringify(p)}'>${p.name}</button>`).join('');
    }

    addEventListeners() {
        document.getElementById('play-btn').addEventListener('click', () => { this.isRunning = !this.isRunning; });
        document.getElementById('reset-btn').addEventListener('click', () => this.loadPreset('default'));
        // ... other listeners ...
    }

    loadPreset(id, p) {
        if(p) { /* load from preset data */ }
        else { /* load default values */ }
        this.resetSimulation();
    }

    resetSimulation() {
        this.isRunning = false;
        this.state = { t: 0, jets: [] };
        // Create initial back-to-back partons
        const jet1 = { partons: [{ E: this.params.energy, x: 0, y: 0, vx: 1, vy: 0 }] };
        this.state.jets.push(jet1);
        if (this.params.showDijet) {
            const jet2 = { partons: [{ E: this.params.energy, x: 0, y: 0, vx: -1, vy: 0 }] };
            this.state.jets.push(jet2);
        }
    }

    gameLoop() {
        requestAnimationFrame(() => this.gameLoop());
        if (this.isRunning) {
            this.update(1/60);
        }
        this.draw();
    }

    update(dt) {
        const { state, params } = this;
        state.t += dt;

        state.jets.forEach(jet => {
            jet.partons.forEach(p => {
                p.x += p.vx * dt; p.y += p.vy * dt;

                // Check if inside QGP medium
                const distance_from_center = Math.sqrt(p.x*p.x + p.y*p.y);
                if (distance_from_center < params.radius) {
                    // Energy Loss
                    const dE = params.qhat * Math.pow(params.temp/200, 3) * dt;
                    p.E -= dE;

                    // Showering/Radiation
                    if (Math.random() < p.E / params.energy * 0.1) {
                        const newParton = {E: p.E * 0.3, x:p.x, y:p.y, vx: p.vx + (Math.random()-0.5)*0.2, vy: p.vy + (Math.random()-0.5)*0.2};
                        p.E *= 0.7;
                        jet.partons.push(newParton);
                    }
                }
            });
            jet.partons = jet.partons.filter(p => p.E > 1); // Remove very soft partons
        });
    }

    draw() {
        const { ctx, canvas, state, params } = this;
        ctx.clearRect(0,0,canvas.width, canvas.height);

        // Draw QGP medium
        ctx.fillStyle = `rgba(255, 69, 0, ${params.temp / 500 * 0.5})`;
        ctx.beginPath();
        ctx.arc(canvas.width/2, canvas.height/2, params.radius * 20, 0, 2*Math.PI);
        ctx.fill();

        // Draw jets
        state.jets.forEach(jet => {
            jet.partons.forEach(p => {
                const hue = Math.min(p.E / params.energy * 120, 120); // Green to Red
                ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
                ctx.beginPath();
                ctx.arc(canvas.width/2 + p.x * 20, canvas.height/2 + p.y * 20, 1 + p.E/params.energy * 5, 0, 2*Math.PI);
                ctx.fill();
            });
        });

        // ... update charts and metrics ...
    }
}
</script>
</body>
</html>
