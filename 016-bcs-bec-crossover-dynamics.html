<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: The BCS-BEC Crossover</title>
    <style>
        :root {
            --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --accent-color: #e67e22; --accent-hover: #d35400; --panel-bg: #2a2a2a; --panel-border: #444444; --control-bg: #333333; --control-text: #e0e0e0; --input-bg: #1e1e1e; --button-bg: #d35400; --button-text: #ffffff;
        }
        /* All other styles are identical */
        body { font-family: var(--font-main, sans-serif); background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        .container { max-width: 1800px; margin: 0 auto; padding: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 400px; grid-template-areas: "simulation controls" "charts metrics" "content content" "qa qa"; gap: 20px; }
        @media (max-width: 1200px) { .main-layout { grid-template-columns: 1fr; grid-template-areas: "simulation" "controls" "charts" "metrics" "content" "qa"; } }
        .panel { background-color: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 20px; }
        .panel h2 { margin-top: 0; color: var(--header-color); border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; }
        .simulation-container { position: relative; width: 100%; height: 512px; background-color: #000; border-radius: 5px; }
        .charts-area-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .charts-area-grid { grid-template-columns: 1fr; } }
        .dynamic-chart-container { width: 100%; height: 300px; background-color: #050505; border-radius: 5px; padding: 10px; }
        .control-group { margin-bottom: 15px; } .control-group label { display: block; }
        .presets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .metric-item { background-color: var(--control-bg); padding: 10px; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>From Whispers to Shouts: Simulating the BCS-BEC Crossover</h1></header>
        <div class="main-layout">
            <div class="panel simulation-area"><h2>Fermionic Pairing Visualization</h2><div class="simulation-container"><canvas id="main-canvas"></canvas></div></div>
            <div class="panel controls-area"><h2>Controls</h2><div id="controls-panel"></div></div>
            <div class="panel metrics-area"><h2>Live Metrics</h2><div class="metrics-grid" id="metrics-panel"></div></div>
            <div class="panel charts-area">
                <h2>Data Visualizations</h2>
                <div class="charts-area-grid">
                    <div class="dynamic-chart-container" id="phasediagram-viz"><h2>Phase Diagram</h2><svg id="phasediagram-svg" width="100%" height="calc(100% - 30px)"></svg></div>
                    <div class="dynamic-chart-container"><canvas id="properties-chart-canvas"></canvas></div>
                    <div class="dynamic-chart-container" style="grid-column: 1 / -1;"><canvas id="momentum-chart-canvas"></canvas></div>
                </div>
            </div>
            <div class="panel content-area"><article id="exposition-content"></article></div>
            <div class="panel qa-area"><h2>Questions & Answers</h2><div id="qa-content"></div></div>
        </div>
    </div>
<script>
// --- CONTENT ---
const content = { /* ... 5000+ words of text and 20 Q&A items ... */ };

document.addEventListener('DOMContentLoaded', () => {
    const app = new CrossoverSimApp();
    app.init();
});

class CrossoverSimApp {
    constructor() {
        this.canvas = document.getElementById('main-canvas'); this.ctx = this.canvas.getContext('2d');
        // ... other canvases and svg ...
        this.params = {};
        this.state = {};
    }

    init() {
        this.setupControls();
        this.addEventListeners();
        this.loadPreset('default');
    }

    setupControls() {
        const panel = document.getElementById('controls-panel');
        panel.innerHTML = `
            <div class="control-group"><label>Interaction (1/kFa): <span id="interaction-label"></span></label><input type="range" id="interaction-slider" min="-2" max="2" step="0.05"></div>
            <div class="control-group"><label>Temperature (T/T_F): <span id="temp-label"></span></label><input type="range" id="temp-slider" min="0" max="1.5" step="0.05"></div>
            <div class="control-group"><label>Fermion Density</label><input type="range" id="density-slider" min="20" max="100" step="5"></div>
            <hr>
            <h3>Presets</h3>
            <div class="presets-grid" id="presets-div"></div>
            <hr>
            <button id="reset-btn">Reset</button>
        `;
        const presets = [ {name: 'BCS Limit', i: -1.5, t: 0.2}, {name: 'Unitary', i: 0, t: 0.2}, {name: 'BEC Limit', i: 1.5, t: 0.2}, /* ... 3 more ... */ ];
        document.getElementById('presets-div').innerHTML = presets.map(p => `<button class="preset-btn" data-p='${JSON.stringify(p)}'>${p.name}</button>`).join('');
    }

    addEventListeners() {
        document.getElementById('reset-btn').addEventListener('click', () => this.loadPreset('default'));
        // ... other listeners that call this.update() ...
    }

    loadPreset(id, p) {
        if(p) { /* load from preset data */ }
        else { /* load default values */ }
        this.resetSimulation();
        this.update();
    }

    resetSimulation() {
        this.state = { particles: [] };
        for (let i = 0; i < this.params.density; i++) {
            this.state.particles.push({ x: Math.random(), y: Math.random(), paired_with: -1 });
        }
        // Simple pairing algorithm
        for(let i=0; i<this.state.particles.length; i+=2) {
            if(this.state.particles[i+1]) {
                this.state.particles[i].paired_with = i+1;
                this.state.particles[i+1].paired_with = i;
            }
        }
    }

    update() {
        this.updateParamsFromUI();
        this.calculateState();
        this.draw();
    }

    updateParamsFromUI() { /* ... */ }

    calculateState() {
        const x = this.params.interaction;
        // Simplified analytical formulas for pair size and gap
        const pair_size = Math.exp(-x) + 0.1; // Large on BCS side (x<0), small on BEC side (x>0)
        const pairing_gap = 1 / (1 + Math.exp(-x*2));
        this.state.pair_size = pair_size;
        this.state.pairing_gap = pairing_gap;
    }

    draw() {
        this.drawMainCanvas();
        this.drawPhaseDiagram();
        this.drawPropertiesChart();
        this.drawMomentumChart();
        this.updateMetrics();
    }

    drawMainCanvas() {
        const { ctx, canvas, state, params } = this;
        ctx.clearRect(0,0,canvas.width, canvas.height);

        const pair_size_pixels = state.pair_size * 30;

        state.particles.forEach((p, i) => {
            if (p.paired_with > i) { // Draw each pair once
                const p2 = state.particles[p.paired_with];
                const x1 = p.x * canvas.width; const y1 = p.y * canvas.height;
                const x2 = p2.x * canvas.width; const y2 = p2.y * canvas.height;

                if (params.interaction > 0.5) { // BEC side: draw molecules
                    ctx.strokeStyle = 'var(--accent-color)';
                    ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
                } else { // BCS side: draw large Cooper pairs
                    ctx.strokeStyle = `rgba(230, 126, 34, 0.3)`;
                    ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.arc((x1+x2)/2, (y1+y2)/2, pair_size_pixels, 0, 2*Math.PI); ctx.stroke();
                }
            }
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(p.x * canvas.width, p.y * canvas.height, 3, 0, 2*Math.PI); ctx.fill();
        });
    }

    drawPhaseDiagram() { /* ... draw svg phase diagram with a marker ... */ }
    drawPropertiesChart() { /* ... plot pair size and gap vs interaction ... */ }
    drawMomentumChart() { /* ... */ }
    updateMetrics() { /* ... */ }
}
</script>
</body>
</html>
