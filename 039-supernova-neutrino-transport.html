<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: Supernova Neutrino Transport</title>
    <style>
        :root {
            --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --accent-color: #3498db; --accent-hover: #2980b9; --panel-bg: #2a2a2a; --panel-border: #444444; --control-bg: #333333; --control-text: #e0e0e0; --input-bg: #1e1e1e; --button-bg: #2c81ba; --button-text: #ffffff;
        }
        /* All other styles are identical */
        body { font-family: var(--font-main, sans-serif); background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        .container { max-width: 1800px; margin: 0 auto; padding: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 400px; grid-template-areas: "simulation controls" "charts metrics" "content content" "qa qa"; gap: 20px; }
        @media (max-width: 1200px) { .main-layout { grid-template-columns: 1fr; grid-template-areas: "simulation" "controls" "charts" "metrics" "content" "qa"; } }
        .panel { background-color: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 20px; }
        .panel h2 { margin-top: 0; color: var(--header-color); border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; }
        .simulation-container { position: relative; width: 100%; height: 512px; background-color: #000; border-radius: 5px; }
        .charts-area-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .charts-area-grid { grid-template-columns: 1fr; } }
        .dynamic-chart-container { width: 100%; height: 300px; background-color: #050505; border-radius: 5px; padding: 10px; }
        .control-group { margin-bottom: 15px; } .control-group label { display: block; }
        .presets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .metric-item { background-color: var(--control-bg); padding: 10px; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>The Long Walk Out: Simulating Neutrino Transport in a Supernova</h1></header>
        <div class="main-layout">
            <div class="panel simulation-area"><h2>Proto-Neutron Star Core</h2><div class="simulation-container"><canvas id="main-canvas"></canvas></div></div>
            <div class="panel controls-area"><h2>Controls</h2><div id="controls-panel"></div></div>
            <div class="panel metrics-area"><h2>Live Metrics</h2><div class="metrics-grid" id="metrics-panel"></div></div>
            <div class="panel charts-area">
                <h2>Data Visualizations</h2>
                <div class="charts-area-grid">
                    <div class="dynamic-chart-container"><h2>Radius vs. Time</h2><canvas id="radius-canvas"></canvas></div>
                    <div class="dynamic-chart-container"><h2>Escaped Neutrino Spectrum</h2><canvas id="spectrum-canvas"></canvas></div>
                    <div class="dynamic-chart-container" style="grid-column: 1 / -1;"><h2>Neutrino Interactions</h2><svg id="interactions-svg"></svg></div>
                </div>
            </div>
            <div class="panel content-area"><article id="exposition-content"></article></div>
            <div class="panel qa-area"><h2>Questions & Answers</h2><div id="qa-content"></div></div>
        </div>
    </div>
<script>

    const app = new NeutrinoSimApp();
    app.init();
});

class NeutrinoSimApp {
    constructor() {
        this.canvas = document.getElementById('main-canvas'); this.ctx = this.canvas.getContext('2d');
        // ... other canvases and svg ...
        this.params = {};
        this.state = {};
        this.isRunning = false;
    }

    init() {
        this.setupControls();
        this.addEventListeners();
        this.loadPreset('default');
        this.gameLoop();
    }

    setupControls() {
        // ... setup for 6+ controls: Core Density, Temperature, Neutrino Flavor, etc. ...
    }

    addEventListeners() {
        // ... listeners for controls and presets ...
    }

    loadPreset(id, p) {
        // ... load default or preset values ...
        this.resetSimulation();
    }

    resetSimulation() {
        this.isRunning = true;
        this.state = {
            t: 0,
            neutrinos: [], // { x, y, E, escaped }
            history: []
        };
        // Create initial neutrinos at the center
        for (let i=0; i<this.params.num_neutrinos; i++) {
            this.state.neutrinos.push({ x:0, y:0, E: Math.random()*50, escaped: false });
        }
    }

    gameLoop() {
        requestAnimationFrame(() => this.gameLoop());
        if (this.isRunning) {
            this.update(1e-5); // microsecond timescale
        }
        this.draw();
    }

    update(dt) {
        // Monte Carlo transport
        const { state, params } = this;
        state.t += dt;

        state.neutrinos.forEach(nu => {
            if (nu.escaped) return;

            const r = Math.sqrt(nu.x*nu.x + nu.y*nu.y);
            const density = params.core_density * Math.exp(-r / 20); // Simplified density profile
            const cross_section = Math.pow(nu.E, 2); // sigma ~ E^2
            const mfp = 1 / (density * cross_section); // mean free path

            const step_size = 1; // move 1km
            const scatter_prob = step_size / mfp;

            if (Math.random() < scatter_prob) {
                // Scatter
                const angle = Math.random() * 2 * Math.PI;
                nu.x += Math.cos(angle) * mfp;
                nu.y += Math.sin(angle) * mfp;
            } else {
                // Free stream
                const angle = Math.atan2(nu.y, nu.x);
                nu.x += Math.cos(angle) * step_size;
                nu.y += Math.sin(angle) * step_size;
            }

            if (r > 100) { // Escaped
                nu.escaped = true;
            }
        });
    }

    draw() {
        this.drawMainCanvas();
        // ... other draw calls ...
        this.updateMetrics();
    }

    drawMainCanvas() {
        // ... draw core density heatmap and neutrino paths ...
    }

    updateMetrics() {
        // ... calculate diffusion time, neutrinosphere radius, etc. ...
    }
}
</script>

</html>
