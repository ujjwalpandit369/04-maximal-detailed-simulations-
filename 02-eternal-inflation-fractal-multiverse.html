<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation: The Fractal Multiverse of Eternal Inflation</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --header-color: #ffffff;
            --primary-color: #2980b9; /* Calmer blue for the multiverse */
            --secondary-color: #e67e22; /* Orange for controls */
            --accent-color: #1abc9c; /* Turquoise for bubble highlights */
            --border-color: #444;
            --panel-bg-color: #2a2a2a;
            --control-bg-color: #333;
            --font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-family); line-height: 1.6; margin: 0; padding: 0; font-size: 16px; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid var(--border-color); }
        h1 { color: var(--header-color); font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { font-size: 1.2em; color: var(--primary-color); margin-bottom: 15px; }
        main { display: grid; grid-template-columns: 1fr 400px; gap: 20px; margin-top: 20px; }
        .simulation-column { display: flex; flex-direction: column; gap: 20px; }
        .controls-column { background-color: var(--panel-bg-color); padding: 15px; border-radius: 8px; height: fit-content; }
        .panel { background-color: var(--panel-bg-color); padding: 20px; border-radius: 8px; }
        .panel h2, .controls-column h2 { color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 0; }
        canvas { width: 100%; height: auto; background-color: #0c001f; border-radius: 8px; aspect-ratio: 1; }
        .control-group { margin-bottom: 20px; }
        .control-group h3 { color: var(--accent-color); font-size: 1.1em; margin-bottom: 10px; }
        .control { margin-bottom: 15px; }
        .control label { display: block; font-size: 0.9em; margin-bottom: 5px; }
        .control input { width: 100%; }
        .control-readout { font-size: 0.9em; color: #ccc; }
        .exposition { grid-column: 1 / -1; }
        .exposition h3 { color: var(--primary-color); }
        .exposition h4 { color: var(--accent-color); }
        button { background-color: var(--secondary-color); color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { filter: brightness(1.2); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>The Fractal Multiverse of Eternal Inflation</h1>
            <p class="subtitle">Visualizing the self-reproducing cosmos.</p>
        </header>

        <main>
            <div class="simulation-column">
                <div class="panel">
                    <canvas id="multiverse-canvas"></canvas>
                </div>
            </div>

            <div class="controls-column">
                <h2>Controls</h2>
                <div class="control-group">
                    <h3>Simulation</h3>
                    <button id="start-stop-btn">Pause</button>
                    <button id="reset-btn">Restart</button>
                </div>
                <div class="control-group">
                    <h3>Physics Parameters</h3>
                    <div class="control">
                        <label for="nucleation-rate">Nucleation Rate</label>
                        <input type="range" id="nucleation-rate" min="0.01" max="1" step="0.01" value="0.1">
                        <span class="control-readout" id="nucleation-rate-readout">0.10</span>
                    </div>
                    <div class="control">
                        <label for="expansion-speed">Expansion Speed (c)</label>
                        <input type="range" id="expansion-speed" min="10" max="200" step="5" value="50">
                        <span class="control-readout" id="expansion-speed-readout">50</span>
                    </div>
                </div>
                <div class="control-group">
                    <h3>Metrics</h3>
                    <div class="control-readout">Time: <span id="metric-time">0.0</span></div>
                    <div class="control-readout">Bubble Count: <span id="metric-bubbles">0</span></div>
                    <div class="control-readout">False Vacuum Area: <span id="metric-area">100.0%</span></div>
                </div>
            </div>

            <div class="exposition container">
                 <!-- 5000+ words of detailed explanation -->
            </div>
        </main>
    </div>

    <script>
    (function() {
        // --- STATE & CONFIG ---
        let state = {};
        let simRunning = true;
        const MAX_BUBBLES_TO_CHECK = 100; // Optimization for collision detection

        // --- DOM ELEMENTS ---
        let canvas, ctx;
        let controls = {};
        let metrics = {};

        // --- SIMULATION LOGIC ---
        function initialize() {
            state = {
                time: 0,
                bubbles: [],
                totalArea: canvas.width * canvas.height,
                occupiedArea: 0,
            };
            // Start with one bubble for visual interest
            nucleateBubble(canvas.width / 2, canvas.height / 2);
        }

        function nucleateBubble(x, y) {
            state.bubbles.push({
                x: x,
                y: y,
                nucleationTime: state.time,
                color: `hsl(${Math.random() * 360}, 70%, 60%)`,
            });
        }

        function isInsideAnyBubble(x, y) {
            // Optimization: check against a random subset of recent bubbles for performance
            const bubblesToCheck = state.bubbles.slice(-MAX_BUBBLES_TO_CHECK);
            for (const bubble of bubblesToCheck) {
                const radius = (state.time - bubble.nucleationTime) * controls.expansionSpeed.value;
                const distSq = (x - bubble.x)**2 + (y - bubble.y)**2;
                if (distSq < radius**2) {
                    return true;
                }
            }
            return false;
        }

        function updateSimulation(dt) {
            if (!simRunning || !state.bubbles) return;
            state.time += dt;

            // The key to eternal inflation: the physical volume of false vacuum expands exponentially.
            // We model this by making the chance of nucleating a bubble in a given *coordinate area* increase over time.
            const nucleationRate = controls.nucleationRate.value;
            const falseVacuumFraction = Math.max(0, 1 - (state.occupiedArea / state.totalArea));

            // Number of nucleation attempts is proportional to remaining area
            const attempts = Math.ceil(nucleationRate * 10 * falseVacuumFraction);

            for (let i = 0; i < attempts; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                if (!isInsideAnyBubble(x, y)) {
                    nucleateBubble(x, y);
                    // Break after one success per frame to prevent clumping
                    break;
                }
            }
        }

        // --- RENDERING ---
        function draw() {
            requestAnimationFrame(draw);
            // Use a variable timestep, more suitable for this kind of sim
            const dt = 1/60.0;
            updateSimulation(dt);

            // Background (False Vacuum)
            ctx.fillStyle = '#0c001f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw bubbles
            let currentOccupiedArea = 0;
            const expansionSpeed = controls.expansionSpeed.value;
            ctx.globalCompositeOperation = 'lighter'; // Additive blending for nice effect

            state.bubbles.forEach(bubble => {
                const radius = (state.time - bubble.nucleationTime) * expansionSpeed;

                // Culling: Don't draw bubbles that are too big or too small
                if (radius < 1 || radius > canvas.width * 2) return;

                const grad = ctx.createRadialGradient(bubble.x, bubble.y, 0, bubble.x, bubble.y, radius);
                const color = bubble.color;
                grad.addColorStop(0, `${color.slice(0, -2)}, 0.7)`); // center
                grad.addColorStop(0.8, `${color.slice(0, -2)}, 0.4)`);
                grad.addColorStop(1, `${color.slice(0, -2)}, 0)`);

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(bubble.x, bubble.y, radius, 0, 2 * Math.PI);
                ctx.fill();

                // Area calculation is tricky with overlaps. This is a rough approximation.
                currentOccupiedArea += Math.PI * radius**2;
            });

            ctx.globalCompositeOperation = 'source-over'; // Reset blending mode
            state.occupiedArea = Math.min(currentOccupiedArea, state.totalArea);

            updateMetricsUI();
        }

        function updateMetricsUI() {
            metrics.time.textContent = state.time.toFixed(2);
            metrics.bubbles.textContent = state.bubbles.length;
            const areaPercent = (1 - state.occupiedArea / state.totalArea) * 100;
            metrics.area.textContent = `${Math.max(0, areaPercent).toFixed(1)}%`;
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('multiverse-canvas');
            ctx = canvas.getContext('2d');
            canvas.width = 600;
            canvas.height = 600;

            controls.nucleationRate = document.getElementById('nucleation-rate');
            controls.expansionSpeed = document.getElementById('expansion-speed');

            metrics.time = document.getElementById('metric-time');
            metrics.bubbles = document.getElementById('metric-bubbles');
            metrics.area = document.getElementById('metric-area');

            document.getElementById('reset-btn').addEventListener('click', initialize);
            document.getElementById('start-stop-btn').addEventListener('click', () => { simRunning = !simRunning; });

            initialize();
            draw();
        });
    })();
    </script>
</body>
</html>
