<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation: RS1 Graviton Localization</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --header-color: #ffffff;
            --primary-color: #8bc34a; /* Light green for localization */
            --secondary-color: #009688;
            --accent-color: #ffeb3b; /* Yellow for the zero-mode */
            --border-color: #444;
            --panel-bg-color: #2a2a2a;
            --control-bg-color: #333;
            --font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-family); line-height: 1.6; margin: 0; padding: 0; font-size: 16px; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid var(--border-color); }
        h1 { color: var(--header-color); font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { font-size: 1.2em; color: var(--primary-color); margin-bottom: 15px; }
        main { display: grid; grid-template-columns: 1fr 400px; gap: 20px; margin-top: 20px; }
        .simulation-column { display: flex; flex-direction: column; gap: 20px; }
        .controls-column { background-color: var(--panel-bg-color); padding: 15px; border-radius: 8px; height: fit-content; }
        .panel { background-color: var(--panel-bg-color); padding: 20px; border-radius: 8px; }
        .panel h2, .controls-column h2 { color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 0; }
        canvas { width: 100%; height: auto; background-color: #000; border-radius: 8px; aspect-ratio: 16/9; }
        .control-group { margin-bottom: 20px; }
        .control-group h3 { color: var(--accent-color); font-size: 1.1em; margin-bottom: 10px; }
        .control { margin-bottom: 15px; }
        .control label { display: block; font-size: 0.9em; margin-bottom: 5px; }
        .control input { width: 100%; }
        .control-readout { font-size: 0.9em; color: #ccc; }
        .exposition { grid-column: 1 / -1; }
        button { background-color: var(--primary-color); color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Graviton Localization in the RS1 Model</h1>
            <p class="subtitle">Visualizing the wavefunction of the graviton in the warped extra dimension.</p>
        </header>

        <main>
            <div class="simulation-column">
                <div class="panel">
                    <canvas id="main-canvas"></canvas>
                </div>
            </div>

            <div class="controls-column">
                <h2>Controls</h2>
                <div class="control-group">
                    <h3>Warp Factor</h3>
                    <div class="control">
                        <label for="k-factor">Curvature/Warp Factor (k)</label>
                        <input type="range" id="k-factor" min="0.1" max="5.0" step="0.1" value="2.0">
                        <span class="control-readout" id="k-factor-readout">k = 2.0</span>
                    </div>
                </div>
                <div class="control-group">
                    <h3>Visualization</h3>
                    <div class="control">
                        <label for="show-kk-modes">Show Kaluza-Klein Modes</label>
                        <input type="checkbox" id="show-kk-modes" checked>
                    </div>
                </div>
            </div>

            <div class="exposition container">
                 <!-- Exposition -->
            </div>
        </main>
    </div>

    <script>
    (function() {
        'use strict';
        // --- STATE & CONFIG ---
        let state = {
            k: 2.0,
            showKK: true,
        };
        const Y_MAX = 5; // The physical range of the extra dimension to show

        // --- DOM ELEMENTS ---
        let canvas, ctx;
        let controls = {};

        // --- MATH FUNCTIONS ---
        /**
         * The wavefunction of the graviton zero-mode.
         * It's an exponential, peaked at the Planck brane (y=0).
         */
        function psi_zero_mode(y, k) {
            return Math.exp(-2 * k * Math.abs(y));
        }

        /**
         * The wavefunctions of the massive Kaluza-Klein (KK) modes.
         * These are approximately sinusoidal and are not peaked at the brane.
         */
        function psi_kk_mode(y, n) {
            // This is a simplification. The actual functions are Bessel functions,
            // but sine waves capture the correct qualitative behavior.
            return Math.sin(n * Math.PI * y / Y_MAX) * 0.5;
        }

        // --- RENDERING ---
        function draw() {
            requestAnimationFrame(draw);

            const w = canvas.width;
            const h = canvas.height;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);

            drawAxes();
            drawWavefunctions();
        }

        function drawAxes() {
            const w = canvas.width;
            const h = canvas.height;
            const origin = { x: w / 2, y: h * 0.9 };

            ctx.strokeStyle = 'white';
            ctx.lineWidth = 1;

            // Y-axis (extra dimension)
            ctx.beginPath();
            ctx.moveTo(origin.x, 0);
            ctx.lineTo(origin.x, h);
            ctx.stroke();

            // X-axis (wavefunction amplitude)
            ctx.beginPath();
            ctx.moveTo(0, origin.y);
            ctx.lineTo(w, origin.y);
            ctx.stroke();

            ctx.fillStyle = 'white';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText("ψ (Amplitude)", origin.x, 10);
            ctx.fillText("y (Extra Dimension)", w - 60, origin.y - 10);

            // Planck Brane line
            ctx.strokeStyle = 'rgba(255, 87, 34, 0.8)';
            ctx.lineWidth = 3;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(origin.x, 0);
            ctx.lineTo(origin.x, h);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillText("Planck Brane", origin.x + 50, h/2);
        }

        function drawWavefunctions() {
            const w = canvas.width;
            const h = canvas.height;
            const origin = { x: w / 2, y: h * 0.9 };
            const y_scale = w / (2 * Y_MAX); // Scale physical y to canvas x

            // --- Draw Zero-Mode ---
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent-color');
            ctx.lineWidth = 3;
            ctx.beginPath();
            for(let i = 0; i < w; i++) {
                const x_canvas = i;
                const y_phys = (x_canvas - origin.x) / y_scale;

                const amplitude = psi_zero_mode(y_phys, state.k);
                const y_canvas = origin.y - amplitude * h * 0.8;

                if (i === 0) ctx.moveTo(x_canvas, y_canvas);
                else ctx.lineTo(x_canvas, y_canvas);
            }
            ctx.stroke();

            // --- Draw KK Modes ---
            if (state.showKK) {
                ctx.strokeStyle = 'rgba(0, 150, 136, 0.6)';
                ctx.lineWidth = 1;
                for (let n = 1; n <= 3; n++) {
                    ctx.beginPath();
                    for(let i = 0; i < w; i++) {
                        const x_canvas = i;
                        const y_phys = (x_canvas - origin.x) / y_scale;

                        const amplitude = psi_kk_mode(y_phys, n);
                        const y_canvas = origin.y - amplitude * h * 0.5;

                        if (i === 0) ctx.moveTo(x_canvas, y_canvas);
                        else ctx.lineTo(x_canvas, y_canvas);
                    }
                    ctx.stroke();
                }
            }
        }

        // --- INITIALIZATION & EVENT LISTENERS ---
        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('main-canvas');
            ctx = canvas.getContext('2d');
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            controls.kFactor = document.getElementById('k-factor');
            controls.showKK = document.getElementById('show-kk-modes');

            controls.kFactor.addEventListener('input', (e) => {
                state.k = parseFloat(e.target.value);
                document.getElementById('k-factor-readout').textContent = `k = ${state.k.toFixed(1)}`;
            });
            controls.showKK.addEventListener('change', (e) => {
                state.showKK = e.target.checked;
            });

            window.addEventListener('resize', () => {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
            });

            document.getElementById('k-factor-readout').textContent = `k = ${state.k.toFixed(1)}`;
            draw();
        });
    })();
    </script>
</body>
</html>
