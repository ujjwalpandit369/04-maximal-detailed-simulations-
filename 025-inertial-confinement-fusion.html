<!DOCTYPE html>
<html lang="en">
<head>

    <title>Deep Simulation: Inertial Confinement Fusion</title>
    <style>
        :root {
            --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --accent-color: #1abc9c; --accent-hover: #16a085; --panel-bg: #2a2a2a; --panel-border: #444444; --control-bg: #333333; --control-text: #e0e0e0; --input-bg: #1e1e1e; --button-bg: #16a085; --button-text: #ffffff;
        }
        /* All other styles are identical */
        body { font-family: var(--font-main, sans-serif); background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        .container { max-width: 1800px; margin: 0 auto; padding: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 400px; grid-template-areas: "simulation controls" "charts metrics" "content content" "qa qa"; gap: 20px; }
        @media (max-width: 1200px) { .main-layout { grid-template-columns: 1fr; grid-template-areas: "simulation" "controls" "charts" "metrics" "content" "qa"; } }
        .panel { background-color: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 20px; }
        .panel h2 { margin-top: 0; color: var(--header-color); border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; }
        .simulation-container { position: relative; width: 100%; height: 512px; background-color: #050505; border-radius: 5px; }
        .charts-area-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .charts-area-grid { grid-template-columns: 1fr; } }
        .dynamic-chart-container { width: 100%; height: 300px; background-color: #050505; border-radius: 5px; padding: 10px; }
        .control-group { margin-bottom: 15px; } .control-group label { display: block; }
        .presets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .metric-item { background-color: var(--control-bg); padding: 10px; border-radius: 5px; text-align: center; }
    </style>
</head>

            <div class="panel metrics-area"><h2>Live Metrics</h2><div class="metrics-grid" id="metrics-panel"></div></div>
            <div class="panel charts-area">
                <h2>Data Visualizations</h2>
                <div class="charts-area-grid">
                    <div class="dynamic-chart-container"><h2>Lawson Criterion</h2><canvas id="lawson-canvas"></canvas></div>
                    <div class="dynamic-chart-container"><h2>Central Conditions</h2><canvas id="center-canvas"></canvas></div>
                    <div class="dynamic-chart-container" style="grid-column: 1 / -1;"><h2>Capsule Cross-Section</h2><svg id="cross-section-svg"></svg></div>
                </div>
            </div>
            <div class="panel content-area"><article id="exposition-content"></article></div>
            <div class="panel qa-area"><h2>Questions & Answers</h2><div id="qa-content"></div></div>
        </div>
    </div>
