<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation: Spacetime Foam & Virtual Black Holes</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --header-color: #ffffff;
            --primary-color: #9b59b6; /* Purple for exotic/virtual objects */
            --secondary-color: #e74c3c;
            --accent-color: #3498db;
            --border-color: #444;
            --panel-bg-color: #2a2a2a;
            --control-bg-color: #333;
            --font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-family); line-height: 1.6; margin: 0; padding: 0; font-size: 16px; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid var(--border-color); }
        h1 { color: var(--header-color); font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { font-size: 1.2em; color: var(--primary-color); margin-bottom: 15px; }
        main { display: grid; grid-template-columns: 1fr 400px; gap: 20px; margin-top: 20px; }
        .simulation-column { display: flex; flex-direction: column; gap: 20px; }
        .controls-column { background-color: var(--panel-bg-color); padding: 15px; border-radius: 8px; height: fit-content; }
        .panel { background-color: var(--panel-bg-color); padding: 20px; border-radius: 8px; }
        .panel h2, .controls-column h2 { color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 0; }
        canvas { width: 100%; height: auto; background-color: #000; border-radius: 8px; aspect-ratio: 16/9; }
        .control-group { margin-bottom: 20px; }
        .control-group h3 { color: var(--accent-color); font-size: 1.1em; margin-bottom: 10px; }
        .control { margin-bottom: 15px; }
        .control label { display: block; font-size: 0.9em; margin-bottom: 5px; }
        .control input { width: 100%; }
        .control-readout { font-size: 0.9em; color: #ccc; }
        .exposition { grid-column: 1 / -1; }
        button { background-color: var(--primary-color); color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Spacetime Foam: Virtual Black Holes</h1>
            <p class="subtitle">A simulation of particle scattering through a sea of quantum wormholes.</p>
        </header>

        <main>
            <div class="simulation-column">
                <div class="panel">
                    <canvas id="main-canvas"></canvas>
                </div>
            </div>

            <div class="controls-column">
                <h2>Controls</h2>
                <div class="control-group">
                    <h3>Simulation</h3>
                    <button id="fire-particle-btn">Fire Test Particle</button>
                </div>
                <div class="control-group">
                    <h3>Foam Parameters</h3>
                    <div class="control">
                        <label for="foam-density">Foam Density</label>
                        <input type="range" id="foam-density" min="1" max="20" step="1" value="5">
                        <span class="control-readout" id="foam-density-readout">5</span>
                    </div>
                    <div class="control">
                        <label for="vbh-lifetime">VBH Lifetime</label>
                        <input type="range" id="vbh-lifetime" min="0.5" max="5" step="0.1" value="2.0">
                        <span class="control-readout" id="vbh-lifetime-readout">2.0s</span>
                    </div>
                </div>
                 <div class="control-group">
                    <h3>Metrics</h3>
                    <div class="control-readout">Particle Status: <span id="metric-status">Ready</span></div>
                </div>
            </div>

            <div class="exposition container">
                 <!-- Exposition -->
            </div>
        </main>
    </div>

    <script>
    (function() {
        'use strict';
        // --- STATE & CONFIG ---
        let state = {};
        let simRunning = true;

        // --- DOM ELEMENTS ---
        let canvas, ctx;
        let controls = {};
        let metrics = {};

        // --- SIMULATION LOGIC ---
        function initialize() {
            state = {
                time: 0,
                particle: null,
                virtualBlackHoles: [],
            };
            simRunning = true;
        }

        function fireParticle() {
            state.particle = {
                x: 0, y: canvas.height / 2,
                vx: 150, vy: 0, // pixels/sec
                status: 'free',
                capturedBy: null,
                reemissionTime: 0,
            };
        }

        function updateSimulation(dt) {
            if (!simRunning) return;
            state.time += dt;

            // 1. Update Virtual Black Holes (VBHs)
            // Remove expired VBHs
            state.virtualBlackHoles = state.virtualBlackHoles.filter(vbh => vbh.creationTime + vbh.lifetime > state.time);

            // Create new VBHs
            const density = parseFloat(controls.foamDensity.value);
            if (Math.random() < density * dt) {
                const lifetime = parseFloat(controls.vbhLifetime.value);
                state.virtualBlackHoles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: 5 + Math.random() * 10,
                    creationTime: state.time,
                    lifetime: lifetime,
                });
            }

            // 2. Update Test Particle
            if (!state.particle) return;

            if (state.particle.status === 'free') {
                state.particle.x += state.particle.vx * dt;
                state.particle.y += state.particle.vy * dt;

                // Check for capture by a VBH
                for (const vbh of state.virtualBlackHoles) {
                    const distSq = (state.particle.x - vbh.x)**2 + (state.particle.y - vbh.y)**2;
                    if (distSq < vbh.radius**2) {
                        state.particle.status = 'captured';
                        state.particle.capturedBy = vbh;
                        // Set a re-emission time
                        state.particle.reemissionTime = state.time + 0.5 + Math.random() * 0.5;
                        break;
                    }
                }

                // Reset if off-screen
                if (state.particle.x > canvas.width) state.particle = null;

            } else if (state.particle.status === 'captured') {
                // Follow the VBH that captured it
                state.particle.x = state.particle.capturedBy.x;
                state.particle.y = state.particle.capturedBy.y;

                // Check for re-emission
                if (state.time > state.particle.reemissionTime) {
                    state.particle.status = 'free';
                    // Re-emit in a random direction
                    const angle = Math.random() * 2 * Math.PI;
                    const speed = 150;
                    state.particle.vx = Math.cos(angle) * speed;
                    state.particle.vy = Math.sin(angle) * speed;
                }
            }
        }

        // --- RENDERING ---
        function draw() {
            requestAnimationFrame(draw);
            const dt = 1/60.0;
            updateSimulation(dt);

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw VBHs
            state.virtualBlackHoles.forEach(vbh => {
                const lifeFraction = (state.time - vbh.creationTime) / vbh.lifetime;
                const alpha = Math.sin(lifeFraction * Math.PI) * 0.5;
                ctx.fillStyle = `rgba(100, 100, 100, ${alpha})`;
                ctx.beginPath();
                ctx.arc(vbh.x, vbh.y, vbh.radius, 0, 2 * Math.PI);
                ctx.fill();
            });

            // Draw particle
            if (state.particle) {
                ctx.fillStyle = 'yellow';
                if (state.particle.status === 'captured') {
                    ctx.globalAlpha = 0.5;
                }
                ctx.beginPath();
                ctx.arc(state.particle.x, state.particle.y, 4, 0, 2 * Math.PI);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            updateMetricsUI();
        }

        function updateMetricsUI() {
            metrics.status.textContent = state.particle ? state.particle.status : 'Ready';
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('main-canvas');
            ctx = canvas.getContext('2d');
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            controls.foamDensity = document.getElementById('foam-density');
            controls.vbhLifetime = document.getElementById('vbh-lifetime');

            metrics.status = document.getElementById('metric-status');

            document.getElementById('fire-particle-btn').addEventListener('click', fireParticle);
            document.getElementById('reset-btn').addEventListener('click', initialize);

            window.addEventListener('resize', () => {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
            });

            initialize();
            draw();
        });
    })();
    </script>
</body>
</html>
