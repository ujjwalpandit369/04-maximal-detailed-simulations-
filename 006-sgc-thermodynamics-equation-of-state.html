<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: String Gas Thermodynamics</title>
    <style>
        :root {
            --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --accent-color: #d946ef; --accent-hover: #b329c7; --panel-bg: #2a2a2a; --panel-border: #444444; --control-bg: #333333; --control-text: #e0e0e0; --input-bg: #1e1e1e; --button-bg: #c729b8; --button-text: #ffffff;
        }
        /* All other styles are identical */
        body { font-family: var(--font-main, sans-serif); background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        .container { max-width: 1800px; margin: 0 auto; padding: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 400px; grid-template-areas: "simulation controls" "charts metrics" "content content" "qa qa"; gap: 20px; }
        @media (max-width: 1200px) { .main-layout { grid-template-columns: 1fr; grid-template-areas: "simulation" "controls" "charts" "metrics" "content" "qa"; } }
        .panel { background-color: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 20px; }
        .panel h2 { margin-top: 0; color: var(--header-color); border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; }
        .simulation-container { position: relative; width: 100%; height: 500px; background-color: #000; border-radius: 5px; }
        .charts-area-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        @media (max-width: 1400px) { .charts-area-grid { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 768px) { .charts-area-grid { grid-template-columns: 1fr; } }
        .dynamic-chart-container { width: 100%; height: 300px; background-color: #050505; border-radius: 5px; padding: 10px; }
        .control-group { margin-bottom: 15px; } .control-group label { display: block; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .metric-item { background-color: var(--control-bg); padding: 10px; border-radius: 5px; text-align: center; }
        .metric-label { font-size: 0.85em; opacity: 0.8; }
        .metric-value { font-family: var(--font-mono); font-size: 1.2em; font-weight: bold; color: var(--accent-color); }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Cosmic Elasticity: The Equation of State of a String Gas</h1></header>
        <div class="main-layout">
            <div class="panel simulation-area"><h2>Gas Compression Chamber</h2><div class="simulation-container"><canvas id="main-canvas"></canvas></div></div>
            <div class="panel controls-area"><h2>Controls</h2><div id="controls-panel"></div></div>
            <div class="panel metrics-area"><h2>Live Metrics</h2><div class="metrics-grid" id="metrics-panel"></div></div>
            <div class="panel charts-area">
                <h2>Data Visualizations</h2>
                <div class="charts-area-grid">
                    <div class="dynamic-chart-container"><canvas id="pv-chart-canvas"></canvas></div>
                    <div class="dynamic-chart-container"><canvas id="energy-chart-canvas"></canvas></div>
                    <div class="dynamic-chart-container"><canvas id="temp-chart-canvas"></canvas></div>
                </div>
            </div>
            <div class="panel content-area"><article id="exposition-content"></article></div>
            <div class="panel qa-area"><h2>Questions & Answers</h2><div id="qa-content"></div></div>
        </div>
    </div>
<script>
// --- CONTENT (same as before) ---
const content = { /* ... */ };

document.addEventListener('DOMContentLoaded', () => {
    const app = new ThermoSimApp();
    app.init();
});

class ThermoSimApp {
    constructor() {
        this.canvas = document.getElementById('main-canvas'); this.ctx = this.canvas.getContext('2d');
        this.pvChartCanvas = document.getElementById('pv-chart-canvas'); this.pvChartCtx = this.pvChartCanvas.getContext('2d');
        this.energyChartCanvas = document.getElementById('energy-chart-canvas'); this.energyChartCtx = this.energyChartCanvas.getContext('2d');
        this.tempChartCanvas = document.getElementById('temp-chart-canvas'); this.tempChartCtx = this.tempChartCanvas.getContext('2d');
        this.isRunning = true;
        this.params = {};
    }

    init() {
        this.setupControls();
        this.addEventListeners();
        this.loadPreset();
        this.gameLoop();
    }

    setupControls() {
        const panel = document.getElementById('controls-panel');
        panel.innerHTML = `
            <div class="control-group"><label>Volume: <span id="volume-label"></span></label><input type="range" id="volume-slider" min="20" max="100" step="1"></div>
            <div class="control-group"><label>Gas Type</label><select id="gas-type-select"><option value="string">String Gas</option><option value="ideal">Ideal Gas</option></select></div>
            <div class="control-group"><label>Total Energy: <span id="energy-label"></span></label><input type="range" id="energy-slider" min="500" max="2000" step="50"></div>
            <div class="control-group"><label>Particle Count: <span id="particles-label"></span></label><input type="range" id="particles-slider" min="10" max="100" step="5"></div>
            <div class="control-group"><label>Self-Dual Radius: <span id="radius-label"></span></label><input type="range" id="radius-slider" min="20" max="80" step="5"></div>
            <hr>
            <button id="reset-btn">Reset</button>
        `;
    }

    addEventListeners() {
        document.getElementById('reset-btn').addEventListener('click', () => this.loadPreset());
        ['volume', 'gas-type', 'energy', 'particles', 'radius'].forEach(id => {
             const el = document.getElementById(`${id.split('-')[0]}-slider`) || document.getElementById(`${id}-select`);
             el.addEventListener('input', () => this.updateParamsFromUI(id === 'particles'));
        });
    }

    updateParamsFromUI(resetNeeded = false) {
        this.params.volume = parseFloat(document.getElementById('volume-slider').value);
        this.params.gasType = document.getElementById('gas-type-select').value;
        this.params.totalEnergy = parseFloat(document.getElementById('energy-slider').value);
        this.params.particleCount = parseInt(document.getElementById('particles-slider').value);
        this.params.selfDualRadius = parseFloat(document.getElementById('radius-slider').value);
        // update labels...
        if (resetNeeded) this.resetSimulation();
    }

    loadPreset() {
        document.getElementById('volume-slider').value = 100;
        document.getElementById('gas-type-select').value = 'string';
        document.getElementById('energy-slider').value = 1000;
        document.getElementById('particles-slider').value = 50;
        document.getElementById('radius-slider').value = 50;
        this.updateParamsFromUI(true);
    }

    resetSimulation() {
        this.state = { particles: [], pressure: 0, temperature: 0, energyModes: {}, pvHistory: [] };
        for (let i = 0; i < this.params.particleCount; i++) {
            this.state.particles.push({ x: Math.random(), y: Math.random(), vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2, isWinding: false });
        }
    }

    gameLoop() {
        requestAnimationFrame(() => this.gameLoop());
        if (this.isRunning) this.update(1/60);
        this.draw();
    }

    update(dt) {
        const { params, state } = this;
        let kineticEnergy = 0; let windingEnergy = 0;

        // Distribute energy
        if (params.gasType === 'string') {
            const windingFraction = Math.exp(-(params.volume - params.selfDualRadius) / 10);
            windingEnergy = params.totalEnergy * windingFraction;
            kineticEnergy = params.totalEnergy - windingEnergy;
        } else {
            kineticEnergy = params.totalEnergy;
            windingEnergy = 0;
        }
        state.energyModes = { kinetic: kineticEnergy, winding: windingEnergy };

        const avgKE = kineticEnergy / params.particleCount;
        state.temperature = avgKE / 2; // Simple relation

        let momentumTransfer = 0;
        state.particles.forEach(p => {
            const speed = Math.sqrt(avgKE);
            p.x += p.vx * speed * dt * 0.1;
            // ... collision logic ...
        });

        const positivePressure = 0; // Simplified
        const negativePressure = windingEnergy * (params.selfDualRadius / params.volume) * 0.001;
        state.pressure = Math.max(0, positivePressure - negativePressure);

        state.pvHistory.push({ V: params.volume, P: state.pressure, T: state.temperature });
        if (state.pvHistory.length > 100) state.pvHistory.shift();
    }

    draw() {
        // ... draw main canvas ...
        this.drawCharts();
        this.updateMetrics();
    }

    drawCharts() {
        this.drawPVChart();
        this.drawEnergyChart();
        this.drawTempChart();
    }

    drawPVChart() { /* ... */ }

    drawEnergyChart() {
        const ctx = this.energyChartCtx;
        const canvas = ctx.canvas;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const { kinetic, winding } = this.state.energyModes;
        const total = kinetic + winding;
        if (total === 0) return;

        const kineticAngle = (kinetic / total) * 2 * Math.PI;

        ctx.fillStyle = '#4a90e2'; // Kinetic color
        ctx.beginPath();
        ctx.moveTo(canvas.width/2, canvas.height/2);
        ctx.arc(canvas.width/2, canvas.height/2, 100, 0, kineticAngle);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'var(--accent-color)'; // Winding color
        ctx.beginPath();
        ctx.moveTo(canvas.width/2, canvas.height/2);
        ctx.arc(canvas.width/2, canvas.height/2, 100, kineticAngle, 2 * Math.PI);
        ctx.closePath();
        ctx.fill();
    }

    drawTempChart() { /* ... */ }
    updateMetrics() { /* ... */ }
}
</script>
</body>
</html>
