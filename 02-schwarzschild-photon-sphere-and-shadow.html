<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ... head content ... -->
    <style>
        /* ... styles ... */
        #self-test-panel { padding: 1rem; margin-bottom: 1rem; border-radius: 5px; display: none; }
        .test-success { background-color: #222; color: #00ffff; }
        .test-fail { background-color: #333; color: #ff00ff; }
    </style>
    <!-- ... links and scripts ... -->
</head>
<body>
    <header><!-- ... --></header>
    <main>
        <!-- ... -->
        <div id="controls-column">
            <div id="self-test-panel"></div>
            <!-- ... controls ... -->
        </div>
        <!-- ... -->
    </main>
    <script>
    (function() {
        'use strict';
        let mainCanvas, shadowCanvas, potentialChart, sphereSvg, selfTestPanel;
        // ... other variables ...

        document.addEventListener('DOMContentLoaded', () => {
            // ... original DOMContentLoaded logic ...
            runSelfTest();
        });

        function getDOMElements() {
            // ... original getDOMElements logic ...
            selfTestPanel = document.getElementById('self-test-panel');
        }

        // ... other functions ...

        function runSelfTest() {
            const errors = [];
            if (!mainCanvas) errors.push("Main canvas not found.");
            if (!shadowCanvas) errors.push("Shadow canvas not found.");
            if (!potentialChart) errors.push("Potential chart not found.");
            if (!sphereSvg) errors.push("Sphere SVG not found.");
            if (!window.Chart) errors.push("Chart.js library failed to load.");

            selfTestPanel.style.display = 'block';
            if (errors.length > 0) {
                selfTestPanel.className = 'test-fail';
                selfTestPanel.innerHTML = '<strong>Self-Test Failed:</strong><ul>' + errors.map(e => `<li>${e}</li>`).join('') + '</ul>';
            } else {
                selfTestPanel.className = 'test-success';
                selfTestPanel.innerHTML = '<strong>Self-Test Passed.</strong>';
            }
        }
    })();
    </script>
</body>
</html>
