<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: Planetary Magnetic Shielding</title>
    <style>
        :root {
            --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --accent-color: #3498db; --accent-hover: #2980b9; --panel-bg: #2a2a2a; --panel-border: #444444; --control-bg: #333333; --control-text: #e0e0e0; --input-bg: #1e1e1e; --button-bg: #2c81ba; --button-text: #ffffff;
        }
        /* All other styles are identical */
        body { font-family: var(--font-main, sans-serif); background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        .container { max-width: 1800px; margin: 0 auto; padding: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 400px; grid-template-areas: "simulation controls" "charts metrics" "content content" "qa qa"; gap: 20px; }
        @media (max-width: 1200px) { .main-layout { grid-template-columns: 1fr; grid-template-areas: "simulation" "controls" "charts" "metrics" "content" "qa"; } }
        .panel { background-color: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 20px; }
        .panel h2 { margin-top: 0; color: var(--header-color); border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; }
        .simulation-container { position: relative; width: 100%; height: 512px; background-color: #000; border-radius: 5px; }
        .charts-area-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .charts-area-grid { grid-template-columns: 1fr; } }
        .dynamic-chart-container { width: 100%; height: 300px; background-color: #050505; border-radius: 5px; padding: 10px; }
        .control-group { margin-bottom: 15px; } .control-group label { display: block; }
        .presets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .metric-item { background-color: var(--control-bg); padding: 10px; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>The Planetary Forcefield: Simulating Magnetic Shielding and Atmospheric Survival</h1></header>
        <div class="main-layout">
            <div class="panel simulation-area"><h2>Comparative Planet Evolution</h2><div class="simulation-container"><canvas id="main-canvas"></canvas></div></div>
            <div class="panel controls-area"><h2>Controls</h2><div id="controls-panel"></div></div>
            <div class="panel metrics-area"><h2>Live Metrics</h2><div class="metrics-grid" id="metrics-panel"></div></div>
            <div class="panel charts-area">
                <h2>Data Visualizations</h2>
                <div class="charts-area-grid">
                    <div class="dynamic-chart-container"><h2>Atmospheric Mass vs. Time</h2><canvas id="mass-canvas"></canvas></div>
                    <div class="dynamic-chart-container"><h2>Loss Rate vs. Wind Speed</h2><canvas id="loss-rate-canvas"></canvas></div>
                    <div class="dynamic-chart-container" style="grid-column: 1 / -1;"><h2>Atmospheric Escape Mechanisms</h2><svg id="escape-svg"></svg></div>
                </div>
            </div>
            <div class="panel content-area"><article id="exposition-content"></article></div>
            <div class="panel qa-area"><h2>Questions & Answers</h2><div id="qa-content"></div></div>
        </div>
    </div>

    loadPreset(id, p) {

    resetSimulation() {
        this.isRunning = false;
        this.state = {
            t: 0,
            planet1_mass: this.params.initial_mass, // Unmagnetized
            planet2_mass: this.params.initial_mass, // Magnetized
            history: { t:[], m1:[], m2:[] }
        };
    }

    gameLoop() {
        requestAnimationFrame(() => this.gameLoop());
        if (this.isRunning) {
            this.update(1e6); // Timestep in millions of years
        }
        this.draw();
    }

    update(dt) {
        // Simplified atmospheric escape model
        const { state, params } = this;
        state.t += dt;

        // Unmagnetized planet
        const loss_rate_1 = params.solar_wind_flux * (1 / params.gravity);
        state.planet1_mass -= loss_rate_1 * dt;
        if (state.planet1_mass < 0) state.planet1_mass = 0;

        // Magnetized planet
        const shielding_factor = 1 / (1 + Math.pow(params.b_field, 2));
        const loss_rate_2 = loss_rate_1 * shielding_factor;
        state.planet2_mass -= loss_rate_2 * dt;
        if (state.planet2_mass < 0) state.planet2_mass = 0;

        // ... update history for charts ...
    }

    draw() {
        this.drawMainCanvas();
        this.drawMassChart();

</html>
