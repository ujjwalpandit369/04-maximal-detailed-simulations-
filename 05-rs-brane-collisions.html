<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation: Brane Collisions & The Ekpyrotic Universe</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --header-color: #ffffff;
            --primary-color: #e91e63; /* Pink/Red for collisions */
            --secondary-color: #00bcd4;
            --accent-color: #ffc107;
            --border-color: #444;
            --panel-bg-color: #2a2a2a;
            --control-bg-color: #333;
            --font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-family); line-height: 1.6; margin: 0; padding: 0; font-size: 16px; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid var(--border-color); }
        h1 { color: var(--header-color); font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { font-size: 1.2em; color: var(--primary-color); margin-bottom: 15px; }
        main { display: grid; grid-template-columns: 1fr 400px; gap: 20px; margin-top: 20px; }
        .simulation-column { display: flex; flex-direction: column; gap: 20px; }
        .controls-column { background-color: var(--panel-bg-color); padding: 15px; border-radius: 8px; height: fit-content; }
        .panel { background-color: var(--panel-bg-color); padding: 20px; border-radius: 8px; }
        .panel h2, .controls-column h2 { color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 0; }
        canvas { width: 100%; height: auto; background-color: #000; border-radius: 8px; aspect-ratio: 16/9; }
        .control-group { margin-bottom: 20px; }
        .control-group h3 { color: var(--accent-color); font-size: 1.1em; margin-bottom: 10px; }
        .control { margin-bottom: 15px; }
        .control label { display: block; font-size: 0.9em; margin-bottom: 5px; }
        .control input { width: 100%; }
        .control-readout { font-size: 0.9em; color: #ccc; }
        .exposition { grid-column: 1 / -1; }
        button { background-color: var(--primary-color); color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Brane Collisions & The Ekpyrotic Universe</h1>
            <p class="subtitle">A simulation of a cyclic universe model where the Big Bang is a collision.</p>
        </header>

        <main>
            <div class="simulation-column">
                <div class="panel">
                    <canvas id="main-canvas"></canvas>
                </div>
            </div>

            <div class="controls-column">
                <h2>Controls</h2>
                <div class="control-group">
                    <h3>Simulation</h3>
                    <button id="start-stop-btn">Pause</button>
                    <button id="reset-btn">Reset Cycle</button>
                </div>
                <div class="control-group">
                    <h3>Cycle Parameters</h3>
                    <div class="control">
                        <label for="speed">Brane Velocity</label>
                        <input type="range" id="speed" min="10" max="100" step="5" value="30">
                        <span class="control-readout" id="speed-readout">30</span>
                    </div>
                </div>
                 <div class="control-group">
                    <h3>Metrics</h3>
                    <div class="control-readout">Cycle Phase: <span id="metric-phase">Approaching</span></div>
                    <div class="control-readout">Brane Separation: <span id="metric-separation">...</span></div>
                </div>
            </div>

            <div class="exposition container">
                 <!-- Exposition -->
            </div>
        </main>
    </div>

    <script>
    (function() {
        'use strict';
        // --- STATE & CONFIG ---
        let state = {};
        let simRunning = true;
        const MAX_SEPARATION = 0.8; // As a fraction of canvas height

        // --- DOM ELEMENTS ---
        let canvas, ctx;
        let controls = {};
        let metrics = {};

        // --- SIMULATION LOGIC ---
        function initialize() {
            const h = canvas.height;
            state = {
                time: 0,
                phase: 'approaching', // approaching, collided, receding
                brane1_y: h/2 - (h * MAX_SEPARATION / 2),
                brane2_y: h/2 + (h * MAX_SEPARATION / 2),
                velocity: parseFloat(controls.speed.value),
                collisionEffect: null,
            };
            simRunning = true;
        }

        function updateSimulation(dt) {
            if (!simRunning) return;
            state.time += dt;

            const speed = state.velocity * dt;

            if (state.phase === 'approaching') {
                state.brane1_y += speed;
                state.brane2_y -= speed;
                if (state.brane1_y >= state.brane2_y) {
                    state.phase = 'collided';
                    state.brane1_y = state.brane2_y = canvas.height / 2; // Snap to center
                    // Create a collision effect object
                    state.collisionEffect = {
                        creationTime: state.time,
                        duration: 1.0, // 1 second flash
                    };
                }
            } else if (state.phase === 'collided') {
                if (state.time > state.collisionEffect.creationTime + state.collisionEffect.duration) {
                    state.phase = 'receding';
                    state.collisionEffect = null;
                }
            } else if (state.phase === 'receding') {
                state.brane1_y -= speed;
                state.brane2_y += speed;
                if (state.brane1_y <= canvas.height/2 - (canvas.height * MAX_SEPARATION / 2)) {
                    // End of cycle, restart
                    state.phase = 'approaching';
                }
            }
        }

        // --- RENDERING ---
        function draw() {
            requestAnimationFrame(draw);
            updateSimulation(1/60.0);

            const w = canvas.width;
            const h = canvas.height;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);

            drawBranes();
            drawCollision();
            updateMetricsUI();
        }

        function drawBranes() {
            const w = canvas.width;
            ctx.lineWidth = 4;

            // Brane 1
            ctx.strokeStyle = '#00bcd4';
            ctx.beginPath();
            ctx.moveTo(0, state.brane1_y);
            ctx.lineTo(w, state.brane1_y);
            ctx.stroke();

            // Brane 2
            ctx.strokeStyle = '#8bc34a';
            ctx.beginPath();
            ctx.moveTo(0, state.brane2_y);
            ctx.lineTo(w, state.brane2_y);
            ctx.stroke();
        }

        function drawCollision() {
            if (state.phase !== 'collided' || !state.collisionEffect) return;

            const w = canvas.width;
            const h = canvas.height;
            const effectAge = state.time - state.collisionEffect.creationTime;
            const effectProgress = effectAge / state.collisionEffect.duration;

            // A simple expanding and fading flash
            const maxRadius = w / 2;
            const radius = maxRadius * effectProgress;
            const alpha = 1.0 - effectProgress;

            const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, radius);
            grad.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
            grad.addColorStop(0.5, `rgba(255, 255, 0, ${alpha * 0.5})`);
            grad.addColorStop(1, `rgba(255, 150, 0, 0)`);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(w/2, h/2, radius, 0, 2 * Math.PI);
            ctx.fill();
        }

        function updateMetricsUI() {
            metrics.phase.textContent = state.phase.charAt(0).toUpperCase() + state.phase.slice(1);
            const separation = Math.abs(state.brane1_y - state.brane2_y);
            metrics.separation.textContent = separation.toFixed(1) + ' px';
            document.getElementById('speed-readout').textContent = controls.speed.value;
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('main-canvas');
            ctx = canvas.getContext('2d');
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            controls.speed = document.getElementById('speed');
            metrics.phase = document.getElementById('metric-phase');
            metrics.separation = document.getElementById('metric-separation');

            document.getElementById('reset-btn').addEventListener('click', initialize);
            document.getElementById('start-stop-btn').addEventListener('click', () => { simRunning = !simRunning; });

            window.addEventListener('resize', () => {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
                initialize(); // Reset on resize to handle new dimensions
            });

            initialize();
            draw();
        });
    })();
    </script>
</body>
</html>
