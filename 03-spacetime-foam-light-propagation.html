<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation: Light Propagation Through Spacetime Foam</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --header-color: #ffffff;
            --primary-color: #e74c3c; /* Red for Lorentz violation */
            --secondary-color: #ecf0f1;
            --accent-color: #f1c40f;
            --border-color: #444;
            --panel-bg-color: #2a2a2a;
            --control-bg-color: #333;
            --font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-family); line-height: 1.6; margin: 0; padding: 0; font-size: 16px; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid var(--border-color); }
        h1 { color: var(--header-color); font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { font-size: 1.2em; color: var(--primary-color); margin-bottom: 15px; }
        main { display: grid; grid-template-columns: 1fr 400px; gap: 20px; margin-top: 20px; }
        .simulation-column { display: flex; flex-direction: column; gap: 20px; }
        .controls-column { background-color: var(--panel-bg-color); padding: 15px; border-radius: 8px; height: fit-content; }
        .panel { background-color: var(--panel-bg-color); padding: 20px; border-radius: 8px; }
        .panel h2, .controls-column h2 { color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 0; }
        canvas { width: 100%; height: auto; background-color: #000; border-radius: 8px; aspect-ratio: 16/9; }
        .control-group { margin-bottom: 20px; }
        .control-group h3 { color: var(--accent-color); font-size: 1.1em; margin-bottom: 10px; }
        .control { margin-bottom: 15px; }
        .control label { display: block; font-size: 0.9em; margin-bottom: 5px; }
        .control input { width: 100%; }
        .control-readout { font-size: 0.9em; color: #ccc; }
        .exposition { grid-column: 1 / -1; }
        button { background-color: var(--primary-color); color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Light Propagation and Lorentz Violation</h1>
            <p class="subtitle">A simulation of how spacetime foam could affect photons from distant galaxies.</p>
        </header>

        <main>
            <div class="simulation-column">
                <div class="panel">
                    <canvas id="main-canvas"></canvas>
                </div>
            </div>

            <div class="controls-column">
                <h2>Controls</h2>
                <div class="control-group">
                    <h3>Simulation</h3>
                    <button id="fire-pulse-btn">Fire New Pulse</button>
                </div>
                <div class="control-group">
                    <h3>Physics Parameters</h3>
                    <div class="control">
                        <label for="lorentz-violation">Lorentz Violation (k)</label>
                        <input type="range" id="lorentz-violation" min="-0.1" max="0.1" step="0.01" value="0.05">
                        <span class="control-readout" id="lorentz-violation-readout">k = 0.05</span>
                    </div>
                    <div class="control">
                        <label for="energy-spread">Pulse Energy Spread</label>
                        <input type="range" id="energy-spread" min="0.1" max="1.0" step="0.1" value="0.5">
                        <span class="control-readout" id="energy-spread-readout">0.5</span>
                    </div>
                </div>
                <div class="control-group">
                    <h3>Metrics</h3>
                    <div class="control-readout">Time Elapsed: <span id="metric-time">0.0</span> s</div>
                    <div class="control-readout">Pulse Width: <span id="metric-width">0</span> px</div>
                </div>
            </div>

            <div class="exposition container">
                 <!-- Exposition -->
            </div>
        </main>
    </div>

    <script>
    (function() {
        'use strict';
        // --- STATE & CONFIG ---
        let state = {};
        const C_BASE = 100; // Base speed of light in pixels/sec
        const NUM_PHOTONS = 100;

        // --- DOM ELEMENTS ---
        let canvas, ctx;
        let controls = {};
        let metrics = {};

        // --- SIMULATION LOGIC ---
        function initialize() {
            state = {
                time: 0,
                photons: [],
            };

            const k = parseFloat(controls.lorentzViolation.value);
            const spread = parseFloat(controls.energySpread.value);
            const mean_energy = 50;

            for (let i = 0; i < NUM_PHOTONS; i++) {
                // Create a distribution of energies around a mean
                const energy = mean_energy + (Math.random() - 0.5) * spread * mean_energy;

                // This is the core of the simplified physics model.
                // The speed of each photon depends on its energy.
                const speed = C_BASE + k * energy;

                state.photons.push({
                    x: 10, // Start just off the left edge
                    y: canvas.height / 2 + (Math.random() - 0.5) * 50, // Small y-spread
                    energy: energy,
                    speed: speed,
                });
            }
        }

        function updateSimulation(dt) {
            state.time += dt;

            let minX = canvas.width;
            let maxX = 0;

            state.photons.forEach(p => {
                p.x += p.speed * dt;
                if (p.x < minX) minX = p.x;
                if (p.x > maxX) maxX = p.x;
            });

            // If pulse is off-screen, reset
            if (minX > canvas.width) {
                initialize();
            }

            state.pulseWidth = maxX - minX;
        }

        // --- RENDERING ---
        function draw() {
            requestAnimationFrame(draw);
            updateSimulation(1/60.0);

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw photons
            state.photons.forEach(p => {
                // Color is mapped to energy (blue = low, red = high)
                const hue = 240 - (p.energy / 100) * 240;
                ctx.fillStyle = `hsl(${hue}, 100%, 70%)`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, 2 * Math.PI);
                ctx.fill();
            });

            updateMetricsUI();
        }

        function updateMetricsUI() {
            metrics.time.textContent = state.time.toFixed(2);
            metrics.width.textContent = state.pulseWidth.toFixed(1);
            document.getElementById('lorentz-violation-readout').textContent = `k = ${controls.lorentzViolation.value}`;
            document.getElementById('energy-spread-readout').textContent = controls.energySpread.value;
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('main-canvas');
            ctx = canvas.getContext('2d');
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            controls.lorentzViolation = document.getElementById('lorentz-violation');
            controls.energySpread = document.getElementById('energy-spread');

            metrics.time = document.getElementById('metric-time');
            metrics.width = document.getElementById('metric-width');

            document.getElementById('fire-pulse-btn').addEventListener('click', initialize);

            window.addEventListener('resize', () => {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
            });

            initialize();
            draw();
        });
    })();
    </script>
</body>
</html>
