<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation: Open-to-Closed String Transition</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --header-color: #ffffff;
            --primary-color: #9c27b0; /* Purple for D-branes/string theory */
            --secondary-color: #00bcd4; /* Cyan for strings */
            --accent-color: #ffeb3b;
            --border-color: #444;
            --panel-bg-color: #2a2a2a;
            --control-bg-color: #333;
            --font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-family); line-height: 1.6; margin: 0; padding: 0; font-size: 16px; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid var(--border-color); }
        h1 { color: var(--header-color); font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { font-size: 1.2em; color: var(--primary-color); margin-bottom: 15px; }
        main { display: grid; grid-template-columns: 1fr 400px; gap: 20px; margin-top: 20px; }
        .simulation-column { display: flex; flex-direction: column; gap: 20px; }
        .controls-column { background-color: var(--panel-bg-color); padding: 15px; border-radius: 8px; height: fit-content; }
        .panel { background-color: var(--panel-bg-color); padding: 20px; border-radius: 8px; }
        .panel h2, .controls-column h2 { color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 0; }
        canvas { width: 100%; height: auto; background-color: #000; border-radius: 8px; aspect-ratio: 16/9; }
        .control-group { margin-bottom: 20px; }
        .control-group h3 { color: var(--accent-color); font-size: 1.1em; margin-bottom: 10px; }
        .control { margin-bottom: 15px; }
        .control label { display: block; font-size: 0.9em; margin-bottom: 5px; }
        .control input { width: 100%; }
        .control-readout { font-size: 0.9em; color: #ccc; }
        .exposition { grid-column: 1 / -1; }
        button { background-color: var(--primary-color); color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Open-to-Closed String Transition</h1>
            <p class="subtitle">A conceptual animation of D-brane decay and string conversion.</p>
        </header>

        <main>
            <div class="simulation-column">
                <div class="panel">
                    <canvas id="main-canvas"></canvas>
                </div>
            </div>

            <div class="controls-column">
                <h2>Controls</h2>
                <div class="control-group">
                    <h3>Simulation</h3>
                    <button id="decay-btn">Start Brane Decay</button>
                    <button id="reset-btn">Reset</button>
                </div>
                <div class="control-group">
                    <h3>Parameters</h3>
                    <div class="control">
                        <label for="num-strings">Number of Strings</label>
                        <input type="range" id="num-strings" min="5" max="50" step="1" value="20">
                        <span class="control-readout" id="num-strings-readout">20</span>
                    </div>
                </div>
                 <div class="control-group">
                    <h3>Metrics</h3>
                    <div class="control-readout">Phase: <span id="metric-phase">Stable</span></div>
                </div>
            </div>

            <div class="exposition container">
                 <!-- Exposition -->
            </div>
        </main>
    </div>

    <script>
    (function() {
        'use strict';
        // --- STATE & CONFIG ---
        let state = {};
        const DECAY_DURATION = 3.0; // in seconds

        // --- DOM ELEMENTS ---
        let canvas, ctx;
        let controls = {};
        let metrics = {};

        // --- SIMULATION LOGIC ---
        function initialize() {
            const numStrings = parseInt(controls.numStrings.value);
            state = {
                time: 0,
                phase: 'stable', // stable, decaying, decayed
                decayStartTime: -1,
                strings: [],
            };

            const brane_y = canvas.height / 2;
            for (let i = 0; i < numStrings; i++) {
                state.strings.push({
                    x: (canvas.width / (numStrings + 1)) * (i + 1),
                    y: brane_y,
                    type: 'open',
                    vx: 0, vy: 0, // For motion after becoming closed
                    size: 20 + Math.random() * 30,
                });
            }
        }

        function startDecay() {
            if (state.phase === 'stable') {
                state.phase = 'decaying';
                state.decayStartTime = state.time;
            }
        }

        function updateSimulation(dt) {
            state.time += dt;

            if (state.phase === 'decaying') {
                if (state.time > state.decayStartTime + DECAY_DURATION) {
                    state.phase = 'decayed';
                    // Transition all open strings to closed strings
                    state.strings.forEach(s => {
                        if (s.type === 'open') {
                            s.type = 'closed';
                            // Give them a random velocity
                            const angle = Math.random() * 2 * Math.PI;
                            const speed = 20 + Math.random() * 30;
                            s.vx = Math.cos(angle) * speed;
                            s.vy = Math.sin(angle) * speed;
                        }
                    });
                }
            } else if (state.phase === 'decayed') {
                // Move the closed strings
                state.strings.forEach(s => {
                    s.x += s.vx * dt;
                    s.y += s.vy * dt;
                });
            }
        }

        // --- RENDERING ---
        function draw() {
            requestAnimationFrame(draw);
            updateSimulation(1/60.0);

            const w = canvas.width;
            const h = canvas.height;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);

            drawBrane();
            drawStrings();
            updateMetricsUI();
        }

        function drawBrane() {
            const w = canvas.width;
            const h = canvas.height;
            const brane_y = h / 2;

            let alpha = 1.0;
            if (state.phase === 'decaying') {
                const decayProgress = (state.time - state.decayStartTime) / DECAY_DURATION;
                alpha = 1.0 - decayProgress;
            } else if (state.phase === 'decayed') {
                alpha = 0;
            }

            if (alpha > 0) {
                ctx.strokeStyle = `rgba(156, 39, 176, ${alpha})`;
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(0, brane_y);
                ctx.lineTo(w, brane_y);
                ctx.stroke();
            }
        }

        function drawStrings() {
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--secondary-color');
            ctx.lineWidth = 2;

            state.strings.forEach(s => {
                if (s.type === 'open') {
                    // Draw a U-shape attached to the brane
                    ctx.beginPath();
                    ctx.moveTo(s.x - 10, s.y);
                    ctx.lineTo(s.x - 10, s.y - s.size);
                    ctx.arc(s.x, s.y - s.size, 10, Math.PI, 0);
                    ctx.lineTo(s.x + 10, s.y);
                    ctx.stroke();
                } else {
                    // Draw a circle (closed string)
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size / 3, 0, 2 * Math.PI);
                    ctx.stroke();
                }
            });
        }

        function updateMetricsUI() {
            metrics.phase.textContent = state.phase.charAt(0).toUpperCase() + state.phase.slice(1);
            document.getElementById('num-strings-readout').textContent = controls.numStrings.value;
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('main-canvas');
            ctx = canvas.getContext('2d');
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            controls.numStrings = document.getElementById('num-strings');
            metrics.phase = document.getElementById('metric-phase');

            document.getElementById('decay-btn').addEventListener('click', startDecay);
            document.getElementById('reset-btn').addEventListener('click', initialize);
            controls.numStrings.addEventListener('input', initialize);

            window.addEventListener('resize', () => {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
                initialize();
            });

            initialize();
            draw();
        });
    })();
    </script>
</body>
</html>
