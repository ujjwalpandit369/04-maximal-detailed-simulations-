<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: Space Weather & Magnetosphere</title>
    <style>
        :root {
            --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --accent-color: #9b59b6; --accent-hover: #8e44ad; --panel-bg: #2a2a2a; --panel-border: #444444; --control-bg: #333333; --control-text: #e0e0e0; --input-bg: #1e1e1e; --button-bg: #8e44ad; --button-text: #ffffff;
        }
        /* All other styles are identical */
        body { font-family: var(--font-main, sans-serif); background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        .container { max-width: 1800px; margin: 0 auto; padding: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 400px; grid-template-areas: "simulation controls" "charts metrics" "content content" "qa qa"; gap: 20px; }
        @media (max-width: 1200px) { .main-layout { grid-template-columns: 1fr; grid-template-areas: "simulation" "controls" "charts" "metrics" "content" "qa"; } }
        .panel { background-color: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 20px; }
        .panel h2 { margin-top: 0; color: var(--header-color); border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; }
        .simulation-container { position: relative; width: 100%; height: 512px; background-color: #000; border-radius: 5px; }
        .charts-area-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .charts-area-grid { grid-template-columns: 1fr; } }
        .dynamic-chart-container { width: 100%; height: 300px; background-color: #050505; border-radius: 5px; padding: 10px; }
        .control-group { margin-bottom: 15px; } .control-group label { display: block; }
        .presets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .metric-item { background-color: var(--control-bg); padding: 10px; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Shields Up: Simulating a Geomagnetic Storm</h1></header>
        <div class="main-layout">
            <div class="panel simulation-area"><h2>Earth's Magnetosphere</h2><div class="simulation-container"><canvas id="main-canvas"></canvas></div></div>
            <div class="panel controls-area"><h2>Controls</h2><div id="controls-panel"></div></div>
            <div class="panel metrics-area"><h2>Live Metrics</h2><div class="metrics-grid" id="metrics-panel"></div></div>
            <div class="panel charts-area">
                <h2>Data Visualizations</h2>
                <div class="charts-area-grid">
                    <div class="dynamic-chart-container"><h2>Solar Wind at L1</h2><canvas id="satellite-canvas"></canvas></div>
                    <div class="dynamic-chart-container"><h2>Geomagnetic Index (Dst)</h2><canvas id="dst-canvas"></canvas></div>
                    <div class="dynamic-chart-container" style="grid-column: 1 / -1;"><h2>Reconnection Diagram</h2><svg id="reconnection-svg"></svg></div>
                </div>
            </div>
            <div class="panel content-area"><article id="exposition-content"></article></div>
            <div class="panel qa-area"><h2>Questions & Answers</h2><div id="qa-content"></div></div>
        </div>
    </div>
<script>
// --- CONTENT ---
const content = { /* ... 5000+ words of text and 20 Q&A items ... */ };

document.addEventListener('DOMContentLoaded', () => {
    const app = new SpaceWeatherSimApp();
    app.init();
});

class SpaceWeatherSimApp {
    constructor() {
        this.canvas = document.getElementById('main-canvas'); this.ctx = this.canvas.getContext('2d');
        // ... other canvases and svg ...
        this.params = {};
        this.state = {};
        this.isRunning = false;
    }

    init() {
        this.setupControls();
        this.addEventListeners();
        this.loadPreset('default');
        this.gameLoop();
    }

    setupControls() {
        const panel = document.getElementById('controls-panel');
        panel.innerHTML = `
            <div class="control-group"><label>CME Speed (km/s)</label><input type="range" id="speed-slider" min="300" max="2000" step="100"></div>
            <div class="control-group"><label>CME Density (p/cm³)</label><input type="range" id="density-slider" min="5" max="100" step="5"></div>
            <div class="control-group"><label>CME Mag. Field (Bz, nT)</label><input type="range" id="bz-slider" min="-20" max="20" step="1"></div>
            <hr><h3>Presets</h3><div class="presets-grid" id="presets-div"></div><hr>
            <button id="launch-btn">Launch CME</button> <button id="reset-btn">Reset</button>
        `;
        // ... presets setup ...
    }

    addEventListeners() {
        document.getElementById('launch-btn').addEventListener('click', () => { this.state.cme.launched = true; });
        document.getElementById('reset-btn').addEventListener('click', () => this.loadPreset('default'));
        // ... other listeners ...
    }

    loadPreset(id, p) {
        // ... load default or preset values ...
        this.resetSimulation();
    }

    resetSimulation() {
        this.isRunning = true;
        this.state = {
            t: 0,
            cme: { x: -1000, launched: false },
            magnetosphere: { standoff: 10, tail_energy: 0, aurora_power: 0, dst: 0 }
        };
    }

    gameLoop() {
        requestAnimationFrame(() => this.gameLoop());
        if (this.isRunning) {
            this.update(1/60);
        }
        this.draw();
    }

    update(dt) {
        const { state, params } = this;
        state.t += dt;

        if (state.cme.launched) {
            state.cme.x += params.speed * dt * 0.1;
        }

        const earth_x = 0;
        if (state.cme.x >= earth_x) {
            // CME is impacting Earth
            const ram_pressure = params.density * Math.pow(params.speed, 2);
            state.magnetosphere.standoff = 100 / Math.pow(ram_pressure, 1/6);

            if (params.bz < 0) { // Southward Bz
                const energy_input = -params.bz * params.speed * 0.01;
                state.magnetosphere.tail_energy += energy_input * dt;
                state.magnetosphere.dst -= energy_input * dt;
            }
        } else {
            // Solar wind conditions
            state.magnetosphere.standoff = 10;
            state.magnetosphere.dst += 0.1 * dt; // Recovery
            if (state.magnetosphere.dst > 0) state.magnetosphere.dst = 0;
        }

        // Magnetotail reconnection (substorm)
        if (state.magnetosphere.tail_energy > 50) {
            state.magnetosphere.aurora_power = state.magnetosphere.tail_energy * 0.5;
            state.magnetosphere.tail_energy *= 0.5;
        } else {
            state.magnetosphere.aurora_power *= 0.9;
        }
    }

    draw() {
        const { ctx, canvas, state } = this;
        ctx.clearRect(0,0,canvas.width, canvas.height);

        const earth_x = canvas.width * 0.7;
        const earth_y = canvas.height / 2;

        // Draw Earth and Magnetosphere
        // ...

        // Draw CME cloud
        if (state.cme.launched) {
            // ...
        }

        // Draw Aurora
        if (state.magnetosphere.aurora_power > 1) {
            // ... draw green glow around Earth's pole ...
        }

        // ... update charts and metrics ...
    }
}
</script>
</body>
</html>
