<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ... head content ... -->
    <style>
        /* ... styles ... */
        #self-test-panel { padding: 1rem; margin-bottom: 1rem; border-radius: 5px; display: none; }
        .test-success { background-color: #333; color: #f0e68c; }
        .test-fail { background-color: #333; color: #ff6b6b; }
    </style>
    <!-- ... links and scripts ... -->
</head>
<body>
    <!-- ... -->
    <div id="controls-column" class="ui-container">
        <div id="self-test-panel"></div>
        <h3>Lensing Controls</h3>
        <!-- ... -->
    </div>
    <!-- ... -->
    <script>
    (function() {
        'use strict';
        let canvas, gl, deflectionChart, lensingSvg, selfTestPanel;
        // ... other variables ...

        document.addEventListener('DOMContentLoaded', () => {
            getDOMElements(); addEventListeners(); initWebGL();
            runSelfTest();
        });

        function getDOMElements() {
            // ... original getDOMElements logic ...
            selfTestPanel = document.getElementById('self-test-panel');
        }

        // ... other functions ...

        function runSelfTest() {
            const errors = [];
            if (!canvas) errors.push("Main WebGL canvas not found.");
            if (!deflectionChart) errors.push("Deflection chart not found.");
            if (!lensingSvg) errors.push("Lensing SVG not found.");
            if (!window.Chart) errors.push("Chart.js library failed to load.");

            selfTestPanel.style.display = 'block';
            if (errors.length > 0) {
                selfTestPanel.className = 'test-fail';
                selfTestPanel.innerHTML = '<strong>Self-Test Failed:</strong><ul>' + errors.map(e => `<li>${e}</li>`).join('') + '</ul>';
            } else {
                selfTestPanel.className = 'test-success';
                selfTestPanel.innerHTML = '<strong>Self-Test Passed.</strong>';
            }
        }
    })();
    </script>
</body>
</html>
