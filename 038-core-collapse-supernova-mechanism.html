<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: Core-Collapse Supernova Mechanism</title>
    <style>
        :root {
            --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --accent-color: #e74c3c; --accent-hover: #c0392b; --panel-bg: #2a2a2a; --panel-border: #444444; --control-bg: #333333; --control-text: #e0e0e0; --input-bg: #1e1e1e; --button-bg: #c0392b; --button-text: #ffffff;
        }
        /* All other styles are identical */
        body { font-family: var(--font-main, sans-serif); background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        .container { max-width: 1800px; margin: 0 auto; padding: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 400px; grid-template-areas: "simulation controls" "charts metrics" "content content" "qa qa"; gap: 20px; }
        @media (max-width: 1200px) { .main-layout { grid-template-columns: 1fr; grid-template-areas: "simulation" "controls" "charts" "metrics" "content" "qa"; } }
        .panel { background-color: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 20px; }
        .panel h2 { margin-top: 0; color: var(--header-color); border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; }
        .simulation-container { position: relative; width: 100%; height: 512px; background-color: #050505; border-radius: 5px; }
        .charts-area-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .charts-area-grid { grid-template-columns: 1fr; } }
        .dynamic-chart-container { width: 100%; height: 300px; background-color: #050505; border-radius: 5px; padding: 10px; }
        .control-group { margin-bottom: 15px; } .control-group label { display: block; }
        .presets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .metric-item { background-color: var(--control-bg); padding: 10px; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>The Stalled Shock: Simulating a Core-Collapse Supernova</h1></header>
        <div class="main-layout">
            <div class="panel simulation-area"><h2>Mass Shell Trajectories (Radius vs. Time)</h2><div class="simulation-container"><canvas id="main-canvas"></canvas></div></div>
            <div class="panel controls-area"><h2>Controls</h2><div id="controls-panel"></div></div>
            <div class="panel metrics-area"><h2>Live Metrics</h2><div class="metrics-grid" id="metrics-panel"></div></div>
            <div class="panel charts-area">
                <h2>Data Visualizations</h2>
                <div class="charts-area-grid">
                    <div class="dynamic-chart-container"><h2>Shock Radius vs. Time</h2><canvas id="shock-canvas"></canvas></div>
                    <div class="dynamic-chart-container"><h2>Diagnostic Energy</h2><canvas id="diag-energy-canvas"></canvas></div>
                    <div class="dynamic-chart-container" style="grid-column: 1 / -1;"><h2>Explosion Anatomy</h2><svg id="anatomy-svg"></svg></div>
                </div>
            </div>
            <div class="panel content-area"><article id="exposition-content"></article></div>
            <div class="panel qa-area"><h2>Questions & Answers</h2><div id="qa-content"></div></div>
        </div>
    </div>
<script>
// --- CONTENT ---
const content = { /* ... 5000+ words of text and 20 Q&A items ... */ };

document.addEventListener('DOMContentLoaded', () => {
    const app = new SupernovaSimApp();
    app.init();
});

class SupernovaSimApp {
    constructor() {
        this.canvas = document.getElementById('main-canvas'); this.ctx = this.canvas.getContext('2d');
        // ... other canvases and svg ...
        this.params = {};
        this.state = {};
        this.isRunning = false;
        this.num_shells = 50;
    }

    init() {
        this.setupControls();
        this.addEventListeners();
        this.loadPreset('default');
        this.gameLoop();
    }

    setupControls() {
        // ... setup for 6+ controls: Neutrino Luminosity, Accretion Rate, Progenitor Mass, etc. ...
    }

    addEventListeners() {
        // ... listeners for controls and presets ...
    }

    loadPreset(id, p) {
        // ... load default or preset values ...
        this.resetSimulation();
    }

    resetSimulation() {
        this.isRunning = false;
        this.state = {
            t: 0,
            shells: [], // { r, v, m }
            shock_radius: 150, // in km
            history: { t:[], shock_r:[], diag_E:[] }
        };
        // Initialize mass shells outside the shock
        for (let i=0; i<this.num_shells; i++) {
            const r = 150 + i * 10;
            this.state.shells.push({ r: r, v: -0.1, m: 0.1 }); // Infalling
        }
    }

    gameLoop() {
        requestAnimationFrame(() => this.gameLoop());
        if (this.isRunning) {
            this.update(1e-3); // ms timescale
        }
        this.draw();
    }

    update(dt) {
        // Simplified 1D hydro model
        const { state, params } = this;
        state.t += dt;

        // Infalling material ram pressure
        const ram_pressure = params.accretion_rate * Math.sqrt(1 / state.shock_radius);

        // Neutrino heating behind the shock
        const heating = params.neutrino_lum;

        // Pressure of the hot bubble
        const bubble_pressure = state.diag_E / (4/3 * Math.PI * Math.pow(state.shock_radius, 3));

        // Move the shock
        const shock_accel = bubble_pressure - ram_pressure;
        const shock_v = shock_accel * dt;
        state.shock_radius += shock_v * dt;

        // Update diagnostic energy
        state.diag_E += (heating - 1.0) * dt; // 1.0 is a mock cooling rate

        // ... update history for charts ...
    }

    draw() {
        this.drawMainCanvas();
        this.drawShockChart();
        // ... other draw calls ...
        this.updateMetrics();
    }

    drawMainCanvas() {
        // ... draw mass shell trajectories r(t) ...
    }

    drawShockChart() {
        // ... draw shock_radius vs time ...
    }

    updateMetrics() {
        // ...
    }
}
</script>
</body>
</html>
