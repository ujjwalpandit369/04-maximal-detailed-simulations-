<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation: Fluctuating Spacetime Geometry</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --header-color: #ffffff;
            --primary-color: #16a085; /* Turquoise for geometry */
            --secondary-color: #e74c3c;
            --accent-color: #f1c40f;
            --border-color: #444;
            --panel-bg-color: #2a2a2a;
            --control-bg-color: #333;
            --font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-family); line-height: 1.6; margin: 0; padding: 0; font-size: 16px; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid var(--border-color); }
        h1 { color: var(--header-color); font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { font-size: 1.2em; color: var(--primary-color); margin-bottom: 15px; }
        main { display: grid; grid-template-columns: 1fr 400px; gap: 20px; margin-top: 20px; }
        .simulation-column { display: flex; flex-direction: column; gap: 20px; }
        .controls-column { background-color: var(--panel-bg-color); padding: 15px; border-radius: 8px; height: fit-content; }
        .panel { background-color: var(--panel-bg-color); padding: 20px; border-radius: 8px; }
        .panel h2, .controls-column h2 { color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 0; }
        canvas { width: 100%; height: auto; background-color: #000; border-radius: 8px; aspect-ratio: 16/9; }
        .control-group { margin-bottom: 20px; }
        .control-group h3 { color: var(--accent-color); font-size: 1.1em; margin-bottom: 10px; }
        .control { margin-bottom: 15px; }
        .control label { display: block; font-size: 0.9em; margin-bottom: 5px; }
        .control input { width: 100%; }
        .control-readout { font-size: 0.9em; color: #ccc; }
        .exposition { grid-column: 1 / -1; }
        button { background-color: var(--primary-color); color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Fluctuating Spacetime Geometry</h1>
            <p class="subtitle">Visualizing the "foamy" nature of space and time at the Planck scale.</p>
        </header>

        <main>
            <div class="simulation-column">
                <div class="panel">
                    <canvas id="main-canvas"></canvas>
                </div>
            </div>

            <div class="controls-column">
                <h2>Controls</h2>
                <div class="control-group">
                    <h3>Simulation</h3>
                    <button id="start-stop-btn">Pause</button>
                    <button id="reset-btn">New Foam Seed</button>
                </div>
                <div class="control-group">
                    <h3>Foam Parameters</h3>
                    <div class="control">
                        <label for="amplitude">Fluctuation Amplitude</label>
                        <input type="range" id="amplitude" min="0" max="20" step="1" value="10">
                        <span class="control-readout" id="amplitude-readout">10</span>
                    </div>
                    <div class="control">
                        <label for="scale">Fluctuation Scale (Zoom)</label>
                        <input type="range" id="scale" min="0.01" max="0.2" step="0.01" value="0.05">
                        <span class="control-readout" id="scale-readout">0.05</span>
                    </div>
                    <div class="control">
                        <label for="speed">Evolution Speed</label>
                        <input type="range" id="speed" min="0.1" max="2" step="0.1" value="0.5">
                        <span class="control-readout" id="speed-readout">0.5</span>
                    </div>
                </div>
            </div>

            <div class="exposition container">
                 <!-- Exposition -->
            </div>
        </main>
    </div>

    <script>
    (function() {
        'use strict';
        // --- STATE & CONFIG ---
        let state = { time: 0 };
        let simRunning = true;
        let perlin;

        // --- DOM ELEMENTS ---
        let canvas, ctx;
        let controls = {};

        /**
         * A self-contained Perlin Noise generator.
         * This is a standard implementation to avoid external libraries.
         */
        const PerlinNoise = {
            p: [],
            permutation: [ 151,160,137,91,90,15,
            131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,
            190, 6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,
            88,237,149,56,87,174,20,125,136,171,168, 68,175,74,165,71,134,139,48,27,166,
            77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,
            102,143,54, 65,25,63,161, 1,216,80,73,209,76,132,187,208, 89,18,169,200,196,
            135,130,116,188,159,86,164,100,109,198,173,186, 3,64,52,217,226,250,124,123,
            5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,
            223,183,170,213,119,248,152, 2,44,154,163, 70,221,153,101,155,167, 43,172,9,
            129,22,39,253, 19,98,108,110,79,113,224,232,178,185, 112,104,218,246,97,228,
            251,34,242,193,238,210,144,12,191,179,162,241, 81,51,145,235,249,14,239,107,
            49,192,214, 31,181,199,106,157,184, 84,204,176,115,121,50,45,127, 4,150,254,
            138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180 ],
            init: function() {
                this.p = new Array(512);
                for (let i=0; i < 256; i++) this.p[256+i] = this.p[i] = this.permutation[i];
            },
            noise: function(x, y, z) {
                this.init();
                let p = this.p;
                let X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
                x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
                let u = this.fade(x), v = this.fade(y), w = this.fade(z);
                let A = p[X]+Y, AA = p[A]+Z, AB = p[A+1]+Z, B = p[X+1]+Y, BA = p[B]+Z, BB = p[B+1]+Z;
                return this.scale(this.lerp(w, this.lerp(v, this.lerp(u, this.grad(p[AA], x, y, z), this.grad(p[BA], x-1, y, z)), this.lerp(u, this.grad(p[AB], x, y-1, z), this.grad(p[BB], x-1, y-1, z))), this.lerp(v, this.lerp(u, this.grad(p[AA+1], x, y, z-1), this.grad(p[BA+1], x-1, y, z-1)), this.lerp(u, this.grad(p[AB+1], x, y-1, z-1), this.grad(p[BB+1], x-1, y-1, z-1)))));
            },
            fade: function(t) { return t * t * t * (t * (t * 6 - 15) + 10); },
            lerp: function(t, a, b) { return a + t * (b - a); },
            grad: function(hash, x, y, z) {
                let h = hash & 15;
                let u = h < 8 ? x : y, v = h < 4 ? y : h == 12 || h == 14 ? x : z;
                return ((h&1) == 0 ? u : -u) + ((h&2) == 0 ? v : -v);
            },
            scale: function(n) { return (1 + n) / 2; }
        };

        // --- SIMULATION LOGIC ---
        function initialize() {
            state.time = 0;
            perlin = Object.create(PerlinNoise);
            simRunning = true;
        }

        function updateSimulation(dt) {
            if (!simRunning) return;
            const speed = parseFloat(controls.speed.value);
            state.time += dt * speed;
        }

        // --- RENDERING ---
        function draw() {
            requestAnimationFrame(draw);
            updateSimulation(1/60.0);

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawGrid();
            updateMetricsUI();
        }

        function drawGrid() {
            const w = canvas.width;
            const h = canvas.height;
            const resolution = 25;
            const cellWidth = w / resolution;
            const cellHeight = h / resolution;

            const amplitude = parseFloat(controls.amplitude.value);
            const scale = parseFloat(controls.scale.value);

            ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
            ctx.lineWidth = 1;

            // Store calculated points to avoid re-calculating
            const points = new Array((resolution + 1) * (resolution + 1));

            for (let i = 0; i <= resolution; i++) {
                for (let j = 0; j <= resolution; j++) {
                    const x0 = i * cellWidth;
                    const y0 = j * cellHeight;

                    // Use two noise fields for x and y displacement for more "turbulence"
                    const dx = amplitude * (perlin.noise(i * scale, j * scale, state.time) - 0.5) * 2;
                    const dy = amplitude * (perlin.noise(i * scale + 100, j * scale + 100, state.time) - 0.5) * 2;

                    points[i * (resolution + 1) + j] = { x: x0 + dx, y: y0 + dy };
                }
            }

            // Draw grid lines
            for (let i = 0; i <= resolution; i++) {
                for (let j = 0; j <= resolution; j++) {
                    const p1 = points[i * (resolution + 1) + j];
                    if (i < resolution) {
                        const p2 = points[(i + 1) * (resolution + 1) + j];
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                    if (j < resolution) {
                        const p3 = points[i * (resolution + 1) + (j + 1)];
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p3.x, p3.y);
                        ctx.stroke();
                    }
                }
            }
        }

        function updateMetricsUI() {
            // Update readouts for sliders
            document.getElementById('amplitude-readout').textContent = controls.amplitude.value;
            document.getElementById('scale-readout').textContent = controls.scale.value;
            document.getElementById('speed-readout').textContent = controls.speed.value;
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('main-canvas');
            ctx = canvas.getContext('2d');
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            controls.amplitude = document.getElementById('amplitude');
            controls.scale = document.getElementById('scale');
            controls.speed = document.getElementById('speed');

            document.getElementById('reset-btn').addEventListener('click', initialize);
            document.getElementById('start-stop-btn').addEventListener('click', () => { simRunning = !simRunning; });

            window.addEventListener('resize', () => {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
            });

            initialize();
            draw();
        });
    })();
    </script>
</body>
</html>
