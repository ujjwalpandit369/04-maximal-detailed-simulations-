<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation: Inhomogeneous Tachyon Condensation & Kink Formation</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --header-color: #ffffff;
            --primary-color: #27ae60; /* Green for field theory/kinks */
            --secondary-color: #e74c3c;
            --accent-color: #f1c40f;
            --border-color: #444;
            --panel-bg-color: #2a2a2a;
            --control-bg-color: #333;
            --font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-family); line-height: 1.6; margin: 0; padding: 0; font-size: 16px; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid var(--border-color); }
        h1 { color: var(--header-color); font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { font-size: 1.2em; color: var(--primary-color); margin-bottom: 15px; }
        main { display: grid; grid-template-columns: 1fr 400px; gap: 20px; margin-top: 20px; }
        .simulation-column { display: flex; flex-direction: column; gap: 20px; }
        .controls-column { background-color: var(--panel-bg-color); padding: 15px; border-radius: 8px; height: fit-content; }
        .panel { background-color: var(--panel-bg-color); padding: 20px; border-radius: 8px; }
        .panel h2, .controls-column h2 { color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 0; }
        canvas { width: 100%; height: auto; background-color: #000; border-radius: 8px; aspect-ratio: 16/9; }
        .control-group { margin-bottom: 20px; }
        .control-group h3 { color: var(--accent-color); font-size: 1.1em; margin-bottom: 10px; }
        .control { margin-bottom: 15px; }
        .control label { display: block; font-size: 0.9em; margin-bottom: 5px; }
        .control input { width: 100%; }
        .control-readout { font-size: 0.9em; color: #ccc; }
        .exposition { grid-column: 1 / -1; }
        button { background-color: var(--primary-color); color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Inhomogeneous Condensation & Kink Formation</h1>
            <p class="subtitle">A simulation of domain wall (kink) formation from an unstable field.</p>
        </header>

        <main>
            <div class="simulation-column">
                <div class="panel">
                    <canvas id="main-canvas"></canvas>
                </div>
            </div>

            <div class="controls-column">
                <h2>Controls</h2>
                <div class="control-group">
                    <h3>Simulation</h3>
                    <button id="start-stop-btn">Pause</button>
                    <button id="reset-btn">Re-initialize Field</button>
                </div>
                <div class="control-group">
                    <h3>Potential V(φ) = -αφ² + βφ⁴</h3>
                    <div class="control">
                        <label for="alpha">α (Instability Term)</label>
                        <input type="range" id="alpha" min="0.1" max="5.0" step="0.1" value="2.0">
                        <span class="control-readout">2.0</span>
                    </div>
                    <div class="control">
                        <label for="beta">β (Stabilizing Term)</label>
                        <input type="range" id="beta" min="0.1" max="2.0" step="0.1" value="1.0">
                        <span class="control-readout">1.0</span>
                    </div>
                </div>
            </div>

            <div class="exposition container">
                 <!-- Exposition -->
            </div>
        </main>
    </div>

    <script>
    (function() {
        'use strict';
        // --- STATE & CONFIG ---
        const NUM_POINTS = 200;
        const DX = 0.1; // Spatial step
        const DT = 0.04; // Time step, must be < DX for stability (CFL condition)
        let state = {};
        let simRunning = true;

        // --- DOM ELEMENTS ---
        let canvas, ctx;
        let controls = {};

        // --- MATH & PHYSICS ---
        function potentialV_prime(phi) {
            const alpha = parseFloat(controls.alpha.value);
            const beta = parseFloat(controls.beta.value);
            return -2 * alpha * phi + 4 * beta * Math.pow(phi, 3);
        }

        // --- SIMULATION LOGIC ---
        function initialize() {
            state.phi = new Array(NUM_POINTS); // Field values at each point
            state.phi_vel = new Array(NUM_POINTS).fill(0); // Field velocities

            // Initialize with small random noise around the unstable equilibrium phi=0
            for (let i = 0; i < NUM_POINTS; i++) {
                state.phi[i] = (Math.random() - 0.5) * 0.1;
            }
            simRunning = true;
        }

        /**
         * The core update loop. Solves the 1+1D wave equation with a potential
         * using a finite difference method.
         * Eq: ∂²φ/∂t² = ∂²φ/∂x² - V'(φ)
         */
        function updateSimulation() {
            if (!simRunning) return;

            const phi = state.phi;
            const vel = state.phi_vel;
            const next_phi = new Array(NUM_POINTS);

            for (let i = 0; i < NUM_POINTS; i++) {
                // --- Finite Difference Calculation ---

                // 1. Get neighbors, applying periodic boundary conditions
                const left = phi[(i - 1 + NUM_POINTS) % NUM_POINTS];
                const right = phi[(i + 1) % NUM_POINTS];
                const current = phi[i];

                // 2. Calculate spatial second derivative (the "tension" term)
                // (∂²φ/∂x²) ≈ (phi[i+1] - 2*phi[i] + phi[i-1]) / dx²
                const laplacian = (left + right - 2 * current) / (DX * DX);

                // 3. Calculate force from potential
                const force = -potentialV_prime(current);

                // 4. Total acceleration is from tension and potential
                const acceleration = laplacian + force;

                // 5. Update velocity and position using Euler method
                vel[i] += acceleration * DT;
                next_phi[i] = current + vel[i] * DT;
            }

            // Update the state with the new field configuration
            state.phi = next_phi;
        }

        // --- RENDERING ---
        function draw() {
            requestAnimationFrame(draw);
            // Run multiple simulation steps per frame for faster evolution
            for(let i=0; i<5; i++) {
                updateSimulation();
            }

            const w = canvas.width;
            const h = canvas.height;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);

            drawFieldProfile();
        }

        function drawFieldProfile() {
            const w = canvas.width;
            const h = canvas.height;
            const y_center = h / 2;
            const y_scale = h / 4; // Scale phi value to canvas height

            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary-color');
            ctx.lineWidth = 2;
            ctx.beginPath();

            for (let i = 0; i < NUM_POINTS; i++) {
                const x_canvas = (i / (NUM_POINTS - 1)) * w;
                const y_canvas = y_center - state.phi[i] * y_scale;

                if (i === 0) ctx.moveTo(x_canvas, y_canvas);
                else ctx.lineTo(x_canvas, y_canvas);
            }
            ctx.stroke();

            // Draw lines for the true vacuum states
            const alpha = parseFloat(controls.alpha.value);
            const beta = parseFloat(controls.beta.value);
            const vac_phi = Math.sqrt(alpha / (2*beta));
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, y_center - vac_phi * y_scale);
            ctx.lineTo(w, y_center - vac_phi * y_scale);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, y_center + vac_phi * y_scale);
            ctx.lineTo(w, y_center + vac_phi * y_scale);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // --- INITIALIZATION & EVENT LISTENERS ---
        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('main-canvas');
            ctx = canvas.getContext('2d');
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            controls.alpha = document.getElementById('alpha');
            controls.beta = document.getElementById('beta');

            document.getElementById('reset-btn').addEventListener('click', initialize);
            document.getElementById('start-stop-btn').addEventListener('click', () => { simRunning = !simRunning; });

            [controls.alpha, controls.beta].forEach(slider => {
                slider.addEventListener('input', (e) => {
                    document.querySelector(`#${e.target.id}-readout`).textContent = e.target.value;
                });
            });

            window.addEventListener('resize', () => {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
            });

            initialize();
            draw();
        });
    })();
    </script>
</body>
</html>
