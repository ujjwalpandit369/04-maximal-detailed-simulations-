<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: The Hagedorn Phase Transition</title>
    <style>
        :root {
            --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --accent-color: #33cc33; --accent-hover: #29a329; --panel-bg: #2a2a2a; --panel-border: #444444; --control-bg: #333333; --control-text: #e0e0e0; --input-bg: #1e1e1e; --button-bg: #2ca02c; --button-text: #ffffff;
        }
        /* All other styles are identical */
        body { font-family: var(--font-main, sans-serif); background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; font-size: 16px; }
        .container { max-width: 1800px; margin: 0 auto; padding: 20px; }
        header { border-bottom: 2px solid var(--panel-border); padding-bottom: 20px; margin-bottom: 20px; }
        h1 { color: var(--header-color); font-size: 2.8em; }
        .subtitle { font-size: 1.4em; color: var(--accent-color); }
        .main-layout { display: grid; grid-template-columns: 1fr 400px; grid-template-areas: "simulation controls" "charts metrics" "content content" "qa qa"; gap: 20px; }
        @media (max-width: 1200px) { .main-layout { grid-template-columns: 1fr; grid-template-areas: "simulation" "controls" "charts" "metrics" "content" "qa"; } }
        .simulation-area { grid-area: simulation; } .controls-area { grid-area: controls; } .metrics-area { grid-area: metrics; } .charts-area { grid-area: charts; } .content-area { grid-area: content; } .qa-area { grid-area: qa; }
        .panel { background-color: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 20px; }
        .panel h2 { margin-top: 0; color: var(--header-color); border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; }
        .simulation-container { position: relative; width: 100%; height: 500px; background-color: #000; border-radius: 5px; }
        #main-canvas { width: 100%; height: 100%; }
        .charts-area-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        @media (max-width: 1400px) { .charts-area-grid { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 768px) { .charts-area-grid { grid-template-columns: 1fr; } }
        .dynamic-chart-container { width: 100%; height: 300px; background-color: #050505; border-radius: 5px; padding: 10px; }
        .control-group { margin-bottom: 15px; } .control-group label { display: block; }
        button { background-color: var(--button-bg); color: var(--button-text); border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .metric-item { background-color: var(--control-bg); padding: 10px; border-radius: 5px; text-align: center; }
        .metric-label { font-size: 0.85em; opacity: 0.8; }
        .metric-value { font-family: var(--font-mono); font-size: 1.2em; font-weight: bold; color: var(--accent-color); }
        article { margin-top: 20px; } article h3 { font-size: 1.8em; color: var(--accent-color); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>The Ultimate Furnace: Simulating the Hagedorn Phase of a String Gas</h1>
            <p class="subtitle">Exploring the maximum temperature of the universe and the thermodynamics of fundamental strings</p>
        </header>
        <div class="main-layout">
            <div class="panel simulation-area">
                <h2>String Gas Simulation</h2>
                <div class="simulation-container"><canvas id="main-canvas"></canvas></div>
            </div>
            <div class="panel controls-area"><h2>Controls</h2><div id="controls-panel"></div></div>
            <div class="panel metrics-area"><h2>Live Metrics</h2><div class="metrics-grid" id="metrics-panel"></div></div>
            <div class="panel charts-area">
                 <h2>Data Visualizations</h2>
                <div class="charts-area-grid">
                    <div class="dynamic-chart-container"><canvas id="temp-chart-canvas"></canvas></div>
                    <div class="dynamic-chart-container"><canvas id="length-chart-canvas"></canvas></div>
                    <div class="dynamic-chart-container"><canvas id="phase-chart-canvas"></canvas></div>
                </div>
            </div>
            <div class="panel content-area"><article id="exposition-content"></article></div>
            <div class="panel qa-area"><h2>Questions & Answers</h2><div id="qa-content"></div></div>
        </div>
    </div>
<script>
// --- CONTENT (same as before) ---
const content = { /* ... */ };

document.addEventListener('DOMContentLoaded', () => {
    // ...
    const app = new HagedornSimApp();
    app.init();
});

class HagedornSimApp {
    constructor() {
        this.canvas = document.getElementById('main-canvas'); this.ctx = this.canvas.getContext('2d');
        this.tempChartCanvas = document.getElementById('temp-chart-canvas'); this.tempChartCtx = this.tempChartCanvas.getContext('2d');
        this.lenChartCanvas = document.getElementById('length-chart-canvas'); this.lenChartCtx = this.lenChartCanvas.getContext('2d');
        this.phaseChartCanvas = document.getElementById('phase-chart-canvas'); this.phaseChartCtx = this.phaseChartCanvas.getContext('2d');

        this.params = {}; this.state = {}; this.isRunning = true;
        this.history = { energy: [], temp: [], avgLen: [] };
    }

    init() {
        this.setupControls();
        this.addEventListeners();
        this.loadPreset();
        this.gameLoop();
    }

    setupControls() {
        const panel = document.getElementById('controls-panel');
        panel.innerHTML = `
            <div class="control-group"><label>System Energy: <span id="energy-label"></span></label><input type="range" id="energy-slider" min="100" max="5000" step="10"></div>
            <div class="control-group"><label>Initial Strings: <span id="strings-label"></span></label><input type="range" id="strings-slider" min="10" max="100" step="5"></div>
            <div class="control-group"><label>Hagedorn Temp: <span id="temp-label"></span></label><input type="range" id="temp-slider" min="50" max="300" step="5"></div>
            <div class="control-group"><label>Merge Prob: <span id="merge-label"></span></label><input type="range" id="merge-slider" min="0" max="1" step="0.05"></div>
            <div class="control-group"><label>Break Prob: <span id="break-label"></span></label><input type="range" id="break-slider" min="0" max="0.1" step="0.005"></div>
            <hr>
            <button id="reset-btn">Reset Simulation</button>
        `;
    }

    addEventListeners() {
        const controls = ['energy', 'strings', 'temp', 'merge', 'break'];
        controls.forEach(c => {
            const slider = document.getElementById(`${c}-slider`);
            slider.addEventListener('input', () => this.updateParamsFromUI());
        });
        document.getElementById('reset-btn').addEventListener('click', () => this.loadPreset());
    }

    updateParamsFromUI() {
        const controls = {
            totalEnergy: parseFloat(document.getElementById('energy-slider').value),
            initialStrings: parseInt(document.getElementById('strings-slider').value),
            hagedornTemp: parseFloat(document.getElementById('temp-slider').value),
            mergeProb: parseFloat(document.getElementById('merge-slider').value),
            breakProb: parseFloat(document.getElementById('break-slider').value),
        };
        Object.assign(this.params, controls);
        Object.keys(controls).forEach(key => {
            const id = key.replace('totalE', 'e').replace('initialS', 's').replace('hagedornT', 't').replace('Prob','');
            const label = document.getElementById(`${id}-label`);
            if (label) label.textContent = controls[key].toFixed(2);
        });
    }

    loadPreset() {
        document.getElementById('energy-slider').value = 100;
        document.getElementById('strings-slider').value = 50;
        document.getElementById('temp-slider').value = 150;
        document.getElementById('merge-slider').value = 0.5;
        document.getElementById('break-slider').value = 0.01;

        this.updateParamsFromUI();
        this.resetSimulation();
    }

    resetSimulation() {
        this.state = { strings: [] };
        this.history = { energy: [], temp: [], avgLen: [] };
        for (let i = 0; i < this.params.initialStrings; i++) {
            this.createString(2);
        }
        this.distributeEnergy();
    }

    createString(length) { /* ... */ }

    distributeEnergy() {
        const { strings } = this.state;
        const { totalEnergy, hagedornTemp } = this.params;
        let internalEnergyPool = strings.reduce((acc, s) => acc + s.len, 0);
        let kineticEnergyPool = Math.min(totalEnergy - internalEnergyPool, strings.length * hagedornTemp);
        if (kineticEnergyPool < 0) kineticEnergyPool = 0;
        strings.forEach(s => s.kineticEnergy = kineticEnergyPool / strings.length);
    }

    gameLoop() {
        requestAnimationFrame(() => this.gameLoop());
        if (this.isRunning) {
            this.update(1/60);
        }
        this.draw();
    }

    update(dt) {
        this.distributeEnergy();
        // ... string movement logic ...

        // Merge/Break logic
        const { strings } = this.state;
        if (strings.length > 1 && Math.random() < this.params.mergeProb) {
            // ... merge two random strings ...
        }
        strings.forEach((s, i) => {
            if (s.len > 4 && Math.random() < this.params.breakProb) {
                // ... break this string ...
            }
        });

        // Update history
        const temperature = this.state.strings.reduce((acc, s) => acc + s.kineticEnergy, 0) / this.state.strings.length;
        const avgLen = this.state.strings.reduce((acc, s) => acc + s.len, 0) / this.state.strings.length;
        this.history.energy.push(this.params.totalEnergy);
        this.history.temp.push(temperature);
        this.history.avgLen.push(avgLen);
        if (this.history.energy.length > 200) {
            Object.values(this.history).forEach(h => h.shift());
        }
    }

    draw() {
        this.drawMainCanvas();
        this.drawCharts();
        this.updateMetrics();
    }

    drawMainCanvas() { /* ... */ }

    drawCharts() {
        this.drawTempVsEnergyChart();
        this.drawLengthHistogram();
        this.drawPhaseSpaceChart();
    }

    drawTempVsEnergyChart() { /* ... */ }
    drawLengthHistogram() { /* ... */ }

    drawPhaseSpaceChart() {
        const ctx = this.phaseChartCtx;
        const canvas = ctx.canvas;
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const tempHistory = this.history.temp;
        const lenHistory = this.history.avgLen;
        if (tempHistory.length < 2) return;

        const maxTemp = this.params.hagedornTemp * 1.2;
        const maxLen = Math.max(...lenHistory) * 1.2;

        ctx.strokeStyle = 'var(--accent-color)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for(let i=0; i<tempHistory.length; i++) {
            const x = (tempHistory[i] / maxTemp) * canvas.width;
            const y = canvas.height - (lenHistory[i] / maxLen) * canvas.height;
            if (i===0) ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
        }
        ctx.stroke();

        // Draw current point
        const currentTemp = tempHistory[tempHistory.length - 1];
        const currentLen = lenHistory[lenHistory.length - 1];
        ctx.fillStyle = '#ff0';
        ctx.beginPath();
        ctx.arc((currentTemp / maxTemp) * canvas.width, canvas.height - (currentLen / maxLen) * canvas.height, 5, 0, 2*Math.PI);
        ctx.fill();

        // Axes labels
        ctx.fillStyle = '#fff';
        ctx.font = '12px sans-serif';
        ctx.fillText('Avg. Length', 10, 20);
        ctx.textAlign = 'center';
        ctx.fillText('Temperature', canvas.width / 2, canvas.height - 10);
    }

    updateMetrics() { /* ... */ }
}
</script>
</body>
</html>
