<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ... head content ... -->
    <style>
        /* ... styles ... */
        #self-test-panel { padding: 1rem; margin-bottom: 1rem; border-radius: 5px; display: none; }
        .test-success { background-color: #201810; color: #ff8c00; }
        .test-fail { background-color: #201810; color: #ff4500; }
    </style>
    <!-- ... links and scripts ... -->
</head>
<body>
    <header><!-- ... --></header>
    <main>
        <!-- ... -->
        <div id="controls-column">
             <div id="self-test-panel"></div>
            <h3>Controls</h3>
            <!-- ... controls ... -->
        </div>
        <!-- ... -->
    </main>
    <script>
    (function() {
        'use strict';
        let distantCanvas, spaghettiSvg, redshiftChart, rVtauChart, selfTestPanel;
        // ... other variables ...

        document.addEventListener('DOMContentLoaded', () => {
            getDOMElements(); addEventListeners(); initCharts(); resetSimulation();
            runSelfTest();
        });

        function getDOMElements() {
            // ... original getDOMElements logic ...
            selfTestPanel = document.getElementById('self-test-panel');
        }

        // ... other functions ...

        function runSelfTest() {
            const errors = [];
            if (!distantCanvas) errors.push("Distant view canvas not found.");
            if (!spaghettiSvg) errors.push("Spaghetti SVG not found.");
            if (!redshiftChart) errors.push("Redshift chart not found.");
            if (!rVtauChart) errors.push("R vs Tau chart not found.");
            if (!window.Chart) errors.push("Chart.js library failed to load.");

            selfTestPanel.style.display = 'block';
            if (errors.length > 0) {
                selfTestPanel.className = 'test-fail';
                selfTestPanel.innerHTML = '<strong>Self-Test Failed:</strong><ul>' + errors.map(e => `<li>${e}</li>`).join('') + '</ul>';
            } else {
                selfTestPanel.className = 'test-success';
                selfTestPanel.innerHTML = '<strong>Self-Test Passed.</strong>';
            }
        }
    })();
    </script>
</body>
</html>
