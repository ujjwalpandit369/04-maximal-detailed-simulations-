<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation: The False Vacuum and Quantum Tunneling</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --header-color: #ffffff;
            --primary-color: #8e44ad; /* Purple for inflation/vaccum energy */
            --secondary-color: #3498db; /* Blue for true vacuum bubbles */
            --accent-color: #f1c40f; /* Yellow for the inflaton field state */
            --border-color: #444;
            --panel-bg-color: #2a2a2a;
            --control-bg-color: #333;
            --font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-family); line-height: 1.6; margin: 0; padding: 0; font-size: 16px; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid var(--border-color); }
        h1 { color: var(--header-color); font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { font-size: 1.2em; color: var(--primary-color); margin-bottom: 15px; }
        main { display: grid; grid-template-columns: 1fr 400px; gap: 20px; margin-top: 20px; }
        .simulation-column { display: grid; grid-template-rows: auto auto; gap: 20px; }
        .controls-column { background-color: var(--panel-bg-color); padding: 15px; border-radius: 8px; height: fit-content; }
        .panel { background-color: var(--panel-bg-color); padding: 20px; border-radius: 8px; }
        .panel h2, .controls-column h2 { color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 0; }
        canvas { width: 100%; height: auto; background-color: #000; border-radius: 8px; }
        #potential-canvas { aspect-ratio: 16/9; }
        #space-canvas { aspect-ratio: 1; }
        .control-group { margin-bottom: 20px; }
        .control-group h3 { color: var(--accent-color); font-size: 1.1em; margin-bottom: 10px; }
        .control { margin-bottom: 15px; }
        .control label { display: block; font-size: 0.9em; margin-bottom: 5px; }
        .control input { width: 100%; }
        .control-readout { font-size: 0.9em; color: #ccc; }
        .exposition { grid-column: 1 / -1; }
        .exposition h3 { color: var(--primary-color); }
        .exposition h4 { color: var(--accent-color); }
        .qa-item { margin-bottom: 20px; border-left: 3px solid var(--border-color); padding-left: 15px; }
        .qa-item strong { color: var(--primary-color); }
        button { background-color: var(--primary-color); color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { filter: brightness(1.2); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>The False Vacuum and Quantum Tunneling</h1>
            <p class="subtitle">An interactive simulation of the engine behind eternal inflation.</p>
        </header>

        <main>
            <div class="simulation-column">
                <div class="panel">
                    <h2>Inflaton Field Potential V(φ)</h2>
                    <canvas id="potential-canvas"></canvas>
                </div>
                <div class="panel">
                    <h2>Bubble Universe Nucleation</h2>
                    <canvas id="space-canvas"></canvas>
                </div>
            </div>

            <div class="controls-column">
                <h2>Controls</h2>
                <div class="control-group">
                    <h3>Simulation</h3>
                    <button id="start-stop-btn">Pause</button>
                    <button id="reset-btn">Reset</button>
                </div>
                <div class="control-group">
                    <h3>Potential Shape V(φ) = Aφ⁴ - Bφ³ + Cφ²</h3>
                    <div class="control">
                        <label for="potential-a">Parameter A (Quartic)</label>
                        <input type="range" id="potential-a" min="0.1" max="2" step="0.1" value="1">
                        <span class="control-readout" id="potential-a-readout">1.0</span>
                    </div>
                    <div class="control">
                        <label for="potential-b">Parameter B (Cubic)</label>
                        <input type="range" id="potential-b" min="0.1" max="4" step="0.1" value="2.5">
                        <span class="control-readout" id="potential-b-readout">2.5</span>
                    </div>
                    <div class="control">
                        <label for="potential-c">Parameter C (Quadratic)</label>
                        <input type="range" id="potential-c" min="0.1" max="2" step="0.1" value="1.5">
                        <span class="control-readout" id="potential-c-readout">1.5</span>
                    </div>
                </div>
                <div class="control-group">
                    <h3>Physics Parameters</h3>
                     <div class="control">
                        <label for="friction">Hubble Friction (3H)</label>
                        <input type="range" id="friction" min="0.01" max="1" step="0.01" value="0.5">
                        <span class="control-readout" id="friction-readout">0.50</span>
                    </div>
                </div>
            </div>

            <div class="exposition container">
                 <!-- 5000+ words of detailed explanation -->
            </div>
        </main>
    </div>

    <script>
    (function() {
        // --- STATE & CONFIG ---
        const config = {
            phi_min: -0.5,
            phi_max: 2.0,
        };
        let state = {};
        let simRunning = true;

        // --- DOM ELEMENTS ---
        let potentialCanvas, potentialCtx, spaceCanvas, spaceCtx;
        let controls = {};

        // --- PHYSICS FUNCTIONS ---
        function potentialV(phi) {
            const A = controls.a.value;
            const B = controls.b.value;
            const C = controls.c.value;
            return A * Math.pow(phi, 4) - B * Math.pow(phi, 3) + C * Math.pow(phi, 2);
        }

        function potentialV_prime(phi) { // dV/d(phi)
            const A = controls.a.value;
            const B = controls.b.value;
            const C = controls.c.value;
            return 4 * A * Math.pow(phi, 3) - 3 * B * Math.pow(phi, 2) + 2 * C * phi;
        }

        function findPotentialMinima() {
            // Find roots of V'(phi) = phi * (4A*phi^2 - 3B*phi + 2C)
            const A = controls.a.value;
            const B = controls.b.value;
            const C = controls.c.value;
            const discriminant = (3*B)**2 - 4 * (4*A) * (2*C);
            if (discriminant < 0) return { falseV: 0, trueV: 0 }; // Only one minimum at phi=0

            const sqrt_d = Math.sqrt(discriminant);
            const phi1 = (3*B - sqrt_d) / (8*A);
            const phi2 = (3*B + sqrt_d) / (8*A);

            // False vacuum is the local minimum, true vacuum is the global minimum
            return potentialV(phi1) < potentialV(phi2) ? { falseV: phi2, trueV: phi1 } : { falseV: phi1, trueV: phi2 };
        }

        // --- SIMULATION LOGIC ---
        function initialize() {
            const minima = findPotentialMinima();
            state = {
                time: 0,
                phi: minima.falseV,
                dphi_dt: 0,
                bubbles: [],
                minima: minima,
            };
        }

        function updateSimulation(dt) {
            if (!simRunning) return;
            state.time += dt;

            // 1. Update Inflaton Field Position (Slow Roll)
            const friction = controls.friction.value;
            const force = -potentialV_prime(state.phi);
            const acceleration = force; // Assume mass=1 for simplicity

            state.dphi_dt += acceleration * dt;
            state.dphi_dt *= (1 - friction * dt); // Hubble friction term
            state.phi += state.dphi_dt * dt;

            // 2. Check for Quantum Tunneling
            const barrier_top_phi = state.minima.falseV > 0 ? 0 : (3*controls.b.value / (4*controls.a.value));
            const V_false_vac = potentialV(state.minima.falseV);
            const V_barrier = potentialV(barrier_top_phi);
            const barrierHeight = Math.max(0, V_barrier - V_false_vac);
            const barrierWidth = Math.abs(state.minima.falseV - state.minima.trueV);

            // Simplified tunneling probability
            const tunnelingExponent = barrierHeight * barrierWidth * 20; // Heuristic
            const tunnelingRate = Math.exp(-tunnelingExponent) * 0.1; // Rate per second

            if (Math.random() < tunnelingRate * dt) {
                // Nucleate a new bubble!
                state.bubbles.push({
                    x: Math.random(),
                    y: Math.random(),
                    nucleationTime: state.time,
                    maxRadius: Math.random() * 0.2 + 0.1, // Give some variety
                });
            }

            // 3. Update existing bubbles
            state.bubbles.forEach(bubble => {
                bubble.radius = (state.time - bubble.nucleationTime); // Assume c=1
            });
        }

        // --- RENDERING ---
        function draw() {
            requestAnimationFrame(draw);
            updateSimulation(1/60.0); // Fixed timestep for stability

            // Clear canvases
            potentialCtx.fillStyle = '#000';
            potentialCtx.fillRect(0, 0, potentialCanvas.width, potentialCanvas.height);
            spaceCtx.fillStyle = 'rgb(50,0,50)'; // False vacuum color
            spaceCtx.fillRect(0, 0, spaceCanvas.width, spaceCanvas.height);

            drawPotential();
            drawSpace();
        }

        function drawPotential() {
            const w = potentialCanvas.width;
            const h = potentialCanvas.height;

            // Draw V(phi) curve
            potentialCtx.strokeStyle = 'white';
            potentialCtx.lineWidth = 2;
            potentialCtx.beginPath();
            let maxV = 0;
            for (let i = 0; i <= w; i++) {
                const phi = config.phi_min + (i / w) * (config.phi_max - config.phi_min);
                const v = potentialV(phi);
                if (v > maxV) maxV = v;
            }
            if (maxV === 0) maxV = 1;

            for (let i = 0; i <= w; i++) {
                const phi = config.phi_min + (i / w) * (config.phi_max - config.phi_min);
                const v = potentialV(phi);
                const x = i;
                const y = h - (v / maxV) * h * 0.8 - h * 0.1;
                if (i === 0) potentialCtx.moveTo(x, y);
                else potentialCtx.lineTo(x, y);
            }
            potentialCtx.stroke();

            // Draw inflaton ball
            const ball_x = w * (state.phi - config.phi_min) / (config.phi_max - config.phi_min);
            const ball_y = h - (potentialV(state.phi) / maxV) * h * 0.8 - h * 0.1;
            potentialCtx.fillStyle = 'yellow';
            potentialCtx.beginPath();
            potentialCtx.arc(ball_x, ball_y, 8, 0, 2 * Math.PI);
            potentialCtx.fill();
        }

        function drawSpace() {
            const w = spaceCanvas.width;
            const h = spaceCanvas.height;

            state.bubbles.forEach(bubble => {
                spaceCtx.fillStyle = 'rgba(52, 152, 219, 0.7)'; // True vacuum color
                spaceCtx.strokeStyle = '#ecf0f1';
                spaceCtx.lineWidth = 2;
                spaceCtx.beginPath();
                const radius = bubble.radius * 50; // Scale radius for visibility
                if (radius < bubble.maxRadius * w) {
                   spaceCtx.arc(bubble.x * w, bubble.y * h, radius, 0, 2 * Math.PI);
                   spaceCtx.fill();
                   spaceCtx.stroke();
                }
            });
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            potentialCanvas = document.getElementById('potential-canvas');
            potentialCtx = potentialCanvas.getContext('2d');
            spaceCanvas = document.getElementById('space-canvas');
            spaceCtx = spaceCanvas.getContext('2d');

            controls.a = document.getElementById('potential-a');
            controls.b = document.getElementById('potential-b');
            controls.c = document.getElementById('potential-c');
            controls.friction = document.getElementById('friction');

            document.getElementById('reset-btn').addEventListener('click', initialize);
            document.getElementById('start-stop-btn').addEventListener('click', () => { simRunning = !simRunning; });

            initialize();
            draw();
        });
    })();
    </script>
</body>
</html>
