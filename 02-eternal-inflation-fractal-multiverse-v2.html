<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation: The Fractal Multiverse (v2)</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --header-color: #ffffff;
            --primary-color: #2980b9;
            --secondary-color: #e67e22;
            --accent-color: #1abc9c;
            --border-color: #444;
            --panel-bg-color: #2a2a2a;
            --control-bg-color: #333;
            --font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-family); line-height: 1.6; margin: 0; padding: 0; font-size: 16px; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid var(--border-color); }
        h1 { color: var(--header-color); font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { font-size: 1.2em; color: var(--primary-color); margin-bottom: 15px; }
        main { display: grid; grid-template-columns: 1fr 400px; gap: 20px; margin-top: 20px; }
        .simulation-column { display: flex; flex-direction: column; gap: 20px; }
        .controls-column { background-color: var(--panel-bg-color); padding: 15px; border-radius: 8px; height: fit-content; }
        .panel { background-color: var(--panel-bg-color); padding: 20px; border-radius: 8px; }
        .panel h2, .controls-column h2 { color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 0; }
        canvas { width: 100%; height: auto; background-color: #0c001f; border-radius: 8px; aspect-ratio: 1; }
        .control-group { margin-bottom: 20px; }
        .control-group h3 { color: var(--accent-color); font-size: 1.1em; margin-bottom: 10px; }
        .control { margin-bottom: 15px; }
        .control label { display: block; font-size: 0.9em; margin-bottom: 5px; }
        .control input { width: 100%; }
        .control-readout { font-size: 0.9em; color: #ccc; }
        .exposition { grid-column: 1 / -1; }
        button { background-color: var(--secondary-color); color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { filter: brightness(1.2); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>The Fractal Multiverse (v2)</h1>
            <p class="subtitle">A robust, optimized simulation of the self-reproducing cosmos.</p>
        </header>

        <main>
            <div class="simulation-column">
                <div class="panel">
                    <canvas id="multiverse-canvas"></canvas>
                </div>
            </div>

            <div class="controls-column">
                <h2>Controls</h2>
                <div class="control-group">
                    <h3>Simulation</h3>
                    <button id="start-stop-btn">Pause</button>
                    <button id="reset-btn">Restart</button>
                </div>
                <div class="control-group">
                    <h3>Physics Parameters</h3>
                    <div class="control">
                        <label for="nucleation-rate">Nucleation Rate</label>
                        <input type="range" id="nucleation-rate" min="1" max="50" step="1" value="10">
                        <span class="control-readout" id="nucleation-rate-readout">10</span>
                    </div>
                    <div class="control">
                        <label for="expansion-speed">Expansion Speed (c)</label>
                        <input type="range" id="expansion-speed" min="10" max="100" step="5" value="30">
                        <span class="control-readout" id="expansion-speed-readout">30</span>
                    </div>
                </div>
                <div class="control-group">
                    <h3>Metrics</h3>
                    <div class="control-readout">Time: <span id="metric-time">0.0</span></div>
                    <div class="control-readout">Bubble Count: <span id="metric-bubbles">0</span></div>
                </div>
            </div>

            <div class="exposition container">
                 <!-- Exposition -->
            </div>
        </main>
    </div>

    <script>
    (function() {
        'use strict';
        // --- STATE & CONFIG ---
        let state = {};
        let simRunning = true;
        const GRID_CELL_SIZE = 100; // For spatial optimization

        // --- DOM ELEMENTS ---
        let canvas, ctx;
        let controls = {};
        let metrics = {};

        // --- SIMULATION LOGIC ---
        function initialize() {
            state = {
                time: 0,
                bubbles: [],
                spatialGrid: new Map(), // Optimization for checking overlaps
                gridCols: Math.ceil(canvas.width / GRID_CELL_SIZE),
            };
            // Start with one bubble
            addBubble(canvas.width / 2, canvas.height / 2);
        }

        function getGridKey(x, y) {
            const col = Math.floor(x / GRID_CELL_SIZE);
            const row = Math.floor(y / GRID_CELL_SIZE);
            return `${col},${row}`;
        }

        function addBubble(x, y) {
            const bubble = {
                x: x,
                y: y,
                nucleationTime: state.time,
                color: `hsl(${Math.random() * 360}, 70%, 60%)`,
            };
            state.bubbles.push(bubble);

            // Add bubble to the spatial grid for faster lookups
            const key = getGridKey(x, y);
            if (!state.spatialGrid.has(key)) {
                state.spatialGrid.set(key, []);
            }
            state.spatialGrid.get(key).push(bubble);
        }

        /**
         * Checks if a point is inside any existing bubble.
         * This version is optimized: it only checks bubbles in the same
         * and adjacent grid cells, instead of all bubbles. This prevents
         * the simulation from slowing down as the bubble count grows.
         */
        function isInsideAnyBubble(x, y) {
            const expansionSpeed = parseFloat(controls.expansionSpeed.value);
            const centerCol = Math.floor(x / GRID_CELL_SIZE);
            const centerRow = Math.floor(y / GRID_CELL_SIZE);

            // Check the 9 cells around the point (center + 8 neighbors)
            for (let dRow = -1; dRow <= 1; dRow++) {
                for (let dCol = -1; dCol <= 1; dCol++) {
                    const key = `${centerCol + dCol},${centerRow + dRow}`;
                    if (state.spatialGrid.has(key)) {
                        for (const bubble of state.spatialGrid.get(key)) {
                            const radius = (state.time - bubble.nucleationTime) * expansionSpeed;
                            const distSq = (x - bubble.x)**2 + (y - bubble.y)**2;
                            if (distSq < radius**2) {
                                return true; // Found an overlap
                            }
                        }
                    }
                }
            }
            return false; // No overlap in the relevant cells
        }

        function updateSimulation(dt) {
            if (!simRunning) return;
            state.time += dt;

            // Number of nucleation attempts per frame
            const attempts = parseInt(controls.nucleationRate.value);

            for (let i = 0; i < attempts; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                if (!isInsideAnyBubble(x, y)) {
                    addBubble(x, y);
                }
            }
        }

        // --- RENDERING ---
        function draw() {
            requestAnimationFrame(draw);
            const dt = 1/60.0;
            updateSimulation(dt);

            ctx.fillStyle = '#0c001f'; // False vacuum color
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const expansionSpeed = parseFloat(controls.expansionSpeed.value);

            state.bubbles.forEach(bubble => {
                const radius = (state.time - bubble.nucleationTime) * expansionSpeed;

                // Culling: Only draw bubbles that are on screen
                if (radius < 1) return;
                if (bubble.x + radius < 0 || bubble.x - radius > canvas.width ||
                    bubble.y + radius < 0 || bubble.y - radius > canvas.height) {
                    return;
                }

                ctx.fillStyle = bubble.color;
                ctx.beginPath();
                ctx.arc(bubble.x, bubble.y, radius, 0, 2 * Math.PI);
                ctx.fill();
            });

            updateMetricsUI();
        }

        function updateMetricsUI() {
            metrics.time.textContent = state.time.toFixed(2);
            metrics.bubbles.textContent = state.bubbles.length;
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('multiverse-canvas');
            ctx = canvas.getContext('2d');
            canvas.width = 600;
            canvas.height = 600;

            controls.nucleationRate = document.getElementById('nucleation-rate');
            controls.expansionSpeed = document.getElementById('expansion-speed');

            metrics.time = document.getElementById('metric-time');
            metrics.bubbles = document.getElementById('metric-bubbles');

            document.getElementById('reset-btn').addEventListener('click', initialize);
            document.getElementById('start-stop-btn').addEventListener('click', () => { simRunning = !simRunning; });

            initialize();
            draw();
        });
    })();
    </script>
</body>
</html>
