<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation: The False Vacuum and Quantum Tunneling (v2)</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --header-color: #ffffff;
            --primary-color: #8e44ad;
            --secondary-color: #3498db;
            --accent-color: #f1c40f;
            --border-color: #444;
            --panel-bg-color: #2a2a2a;
            --control-bg-color: #333;
            --log-bg-color: #000;
            --log-text-color: #0f0;
            --font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-family); line-height: 1.6; margin: 0; padding: 0; font-size: 16px; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid var(--border-color); }
        h1 { color: var(--header-color); font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { font-size: 1.2em; color: var(--primary-color); margin-bottom: 15px; }
        main { display: grid; grid-template-columns: 1fr 400px; gap: 20px; margin-top: 20px; }
        .simulation-column { display: grid; grid-template-rows: auto auto; gap: 20px; }
        .controls-column { background-color: var(--panel-bg-color); padding: 15px; border-radius: 8px; height: fit-content; }
        .panel { background-color: var(--panel-bg-color); padding: 20px; border-radius: 8px; }
        .panel h2, .controls-column h2 { color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 0; }
        canvas { width: 100%; height: auto; background-color: #000; border-radius: 8px; }
        #potential-canvas { aspect-ratio: 16/9; }
        #space-canvas { aspect-ratio: 1; }
        .control-group { margin-bottom: 20px; }
        .control-group h3 { color: var(--accent-color); font-size: 1.1em; margin-bottom: 10px; }
        .control { margin-bottom: 15px; }
        .control label { display: block; font-size: 0.9em; margin-bottom: 5px; }
        .control input { width: 100%; }
        .control-readout { font-size: 0.9em; color: #ccc; }
        .exposition { grid-column: 1 / -1; }
        button { background-color: var(--primary-color); color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .dev-log { background-color: var(--log-bg-color); color: var(--log-text-color); font-family: var(--font-mono); font-size: 0.8em; height: 150px; overflow-y: scroll; padding: 10px; border-radius: 5px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>The False Vacuum and Quantum Tunneling (v2)</h1>
            <p class="subtitle">A robust, simplified simulation of the engine behind eternal inflation.</p>
        </header>

        <main>
            <div class="simulation-column">
                <div class="panel">
                    <h2>Inflaton Field Potential V(φ)</h2>
                    <canvas id="potential-canvas"></canvas>
                </div>
                <div class="panel">
                    <h2>Bubble Universe Nucleation</h2>
                    <canvas id="space-canvas"></canvas>
                </div>
            </div>

            <div class="controls-column">
                <h2>Controls</h2>
                <div class="control-group">
                    <h3>Simulation</h3>
                    <button id="start-stop-btn">Pause</button>
                    <button id="reset-btn">Reset</button>
                </div>
                <div class="control-group">
                    <h3>Physics Parameters</h3>
                     <div class="control">
                        <label for="friction">Hubble Friction</label>
                        <input type="range" id="friction" min="0.01" max="0.5" step="0.01" value="0.1">
                        <span class="control-readout" id="friction-readout">0.10</span>
                    </div>
                    <div class="control">
                        <label for="tunnel-sensitivity">Tunneling Sensitivity</label>
                        <input type="range" id="tunnel-sensitivity" min="1" max="20" step="1" value="10">
                        <span class="control-readout" id="tunnel-sensitivity-readout">10</span>
                    </div>
                </div>
                <div class="control-group">
                    <h3>Developer Log</h3>
                    <div id="dev-log" class="dev-log"></div>
                </div>
            </div>

            <div class="exposition container">
                 <!-- Exposition -->
            </div>
        </main>
    </div>

    <script>
    (function() {
        'use strict';
        // --- STATE & CONFIG ---
        const config = {
            phi_min: -1.5,
            phi_max: 1.5,
            false_vac_phi: -1,
            true_vac_phi: 1,
        };
        let state = {};
        let simRunning = true;
        let logBuffer = [];

        // --- DOM ELEMENTS ---
        let potentialCanvas, potentialCtx, spaceCanvas, spaceCtx, devLog;
        let controls = {};

        // --- PHYSICS FUNCTIONS (Simplified & Robust) ---
        /**
         * A simple, stable double-well potential.
         * V(phi) = (phi^2 - 1)^2 + A*phi
         * The first term creates two minima at phi = -1 and phi = 1.
         * The second term, A*phi, slightly tilts the potential, making one minimum
         * a "false vacuum" (higher energy) and the other a "true vacuum" (lower energy).
         */
        function potentialV(phi) {
            const tilt = 0.15; // A small constant tilt
            return Math.pow(phi * phi - 1, 2) + tilt * phi + 0.2;
        }

        /**
         * The derivative of the potential, dV/d(phi).
         * This is the "force" acting on the inflaton field.
         * V'(phi) = 4*phi*(phi^2 - 1) + A
         */
        function potentialV_prime(phi) {
            const tilt = 0.15;
            return 4 * phi * (phi * phi - 1) + tilt;
        }

        // --- SIMULATION LOGIC ---
        function log(message) {
            logBuffer.push(`[${state.time.toFixed(2)}s] ${message}`);
            if (logBuffer.length > 20) {
                logBuffer.shift();
            }
            devLog.innerHTML = logBuffer.join('<br>');
            devLog.scrollTop = devLog.scrollHeight;
        }

        function initialize() {
            log('Initializing simulation...');
            state = {
                time: 0,
                phi: config.false_vac_phi, // Start in the false vacuum
                dphi_dt: 0,                // Start at rest
                bubbles: [],
                lastLogTime: -1,
            };
            log(`Inflaton starts at false vacuum: φ = ${state.phi.toFixed(2)}`);
        }

        function updateSimulation(dt) {
            if (!simRunning) return;
            state.time += dt;

            // --- 1. Update Inflaton Field Position (Slow Roll) ---
            // Using a simple Euler integrator for clarity and robustness.
            const friction = parseFloat(controls.friction.value);
            const force = -potentialV_prime(state.phi);

            // a = F/m. We assume inflaton mass m=1, so acceleration = force.
            const acceleration = force;

            // Update velocity: v_new = v_old + a * dt
            state.dphi_dt += acceleration * dt;
            // Apply Hubble friction, which damps the velocity
            state.dphi_dt *= (1 - friction * dt);
            // Update position: x_new = x_old + v * dt
            state.phi += state.dphi_dt * dt;

            // --- 2. Check for Quantum Tunneling ---
            const v_false = potentialV(config.false_vac_phi);
            const v_true = potentialV(config.true_vac_phi);
            const barrier_peak_phi = 0; // Peak is roughly at phi=0
            const v_peak = potentialV(barrier_peak_phi);
            const barrierHeight = Math.max(0, v_peak - v_false);

            // Simplified tunneling probability. The core idea is that it's exponentially
            // sensitive to the barrier height. A higher sensitivity makes it more likely.
            const sensitivity = parseFloat(controls.tunnelSensitivity.value);
            const tunnelingProbability = Math.exp(-barrierHeight * sensitivity) * dt;

            const randomCheck = Math.random();
            if (randomCheck < tunnelingProbability) {
                log(`--- TUNNELING SUCCESS! (${randomCheck.toFixed(4)} < ${tunnelingProbability.toExponential(2)}) ---`);
                // Nucleate a new bubble!
                state.bubbles.push({
                    x: Math.random(),
                    y: Math.random(),
                    nucleationTime: state.time,
                });
                // Reset the field to the false vacuum to start a new inflation period
                state.phi = config.false_vac_phi;
                state.dphi_dt = 0;
                log('Inflaton reset to false vacuum.');
            }

            // Log status periodically to avoid spamming the log
            if (state.time - state.lastLogTime > 0.5) {
                log(`φ=${state.phi.toFixed(2)}, V'=${force.toFixed(2)}, P(tunnel)≈${tunnelingProbability.toExponential(2)}`);
                state.lastLogTime = state.time;
            }
        }

        // --- RENDERING ---
        function draw() {
            requestAnimationFrame(draw);
            const dt = 1/60.0;
            updateSimulation(dt);

            drawPotential();
            drawSpace();
        }

        function drawPotential() {
            const w = potentialCanvas.width;
            const h = potentialCanvas.height;
            potentialCtx.fillStyle = '#000';
            potentialCtx.fillRect(0, 0, w, h);

            potentialCtx.strokeStyle = 'white';
            potentialCtx.lineWidth = 2;
            potentialCtx.beginPath();
            const y_scale = h / (potentialV(config.false_vac_phi) * 3); // Auto-scale y-axis
            const x_to_canvas = (p) => w * (p - config.phi_min) / (config.phi_max - config.phi_min);
            const y_to_canvas = (v) => h - v * y_scale;

            for (let i = 0; i <= w; i++) {
                const phi = config.phi_min + (i / w) * (config.phi_max - config.phi_min);
                const x = i;
                const y = y_to_canvas(potentialV(phi));
                if (i === 0) potentialCtx.moveTo(x, y);
                else potentialCtx.lineTo(x, y);
            }
            potentialCtx.stroke();

            // Draw inflaton ball
            const ball_x = x_to_canvas(state.phi);
            const ball_y = y_to_canvas(potentialV(state.phi));
            potentialCtx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent-color');
            potentialCtx.beginPath();
            potentialCtx.arc(ball_x, ball_y, 8, 0, 2 * Math.PI);
            potentialCtx.fill();
        }

        function drawSpace() {
            const w = spaceCanvas.width;
            const h = spaceCanvas.height;
            spaceCtx.fillStyle = 'rgb(50,0,50)'; // False vacuum
            spaceCtx.fillRect(0, 0, w, h);

            const true_vac_color = getComputedStyle(document.documentElement).getPropertyValue('--secondary-color');
            spaceCtx.fillStyle = true_vac_color;

            state.bubbles.forEach(bubble => {
                // Expansion speed is constant in this simple model
                const radius = (state.time - bubble.nucleationTime) * 80;
                spaceCtx.beginPath();
                spaceCtx.arc(bubble.x * w, bubble.y * h, radius, 0, 2 * Math.PI);
                spaceCtx.fill();
            });
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            potentialCanvas = document.getElementById('potential-canvas');
            potentialCtx = potentialCanvas.getContext('2d');
            spaceCanvas = document.getElementById('space-canvas');
            spaceCtx = spaceCanvas.getContext('2d');
            devLog = document.getElementById('dev-log');

            controls.friction = document.getElementById('friction');
            controls.tunnelSensitivity = document.getElementById('tunnel-sensitivity');

            document.getElementById('reset-btn').addEventListener('click', initialize);
            document.getElementById('start-stop-btn').addEventListener('click', () => { simRunning = !simRunning; });

            initialize();
            draw();
        });
    })();
    </script>
</body>
</html>
