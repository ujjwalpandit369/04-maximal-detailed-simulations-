<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Simulation: Attosecond Pulse Generation</title>
    <style>
        :root {
            --bg-color: #1a1a1a; --text-color: #e0e0e0; --header-color: #ffffff; --accent-color: #00aaff; --accent-hover: #0088cc; --panel-bg: #2a2a2a; --panel-border: #444444; --control-bg: #333333; --control-text: #e0e0e0; --input-bg: #1e1e1e; --button-bg: #0077bb; --button-text: #ffffff;
        }
        /* All other styles are identical */
        body { font-family: var(--font-main, sans-serif); background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        .container { max-width: 1800px; margin: 0 auto; padding: 20px; }
        .main-layout { display: grid; grid-template-columns: 1fr 400px; grid-template-areas: "simulation controls" "charts metrics" "content content" "qa qa"; gap: 20px; }
        @media (max-width: 1200px) { .main-layout { grid-template-columns: 1fr; grid-template-areas: "simulation" "controls" "charts" "metrics" "content" "qa"; } }
        .panel { background-color: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 20px; }
        .panel h2 { margin-top: 0; color: var(--header-color); border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; }
        .simulation-container { position: relative; width: 100%; height: 512px; background-color: #050505; border-radius: 5px; }
        .charts-area-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .charts-area-grid { grid-template-columns: 1fr; } }
        .dynamic-chart-container { width: 100%; height: 300px; background-color: #050505; border-radius: 5px; padding: 10px; }
        .control-group { margin-bottom: 15px; } .control-group label { display: block; }
        .presets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .metric-item { background-color: var(--control-bg); padding: 10px; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>Freezing Time: Simulating Attosecond Pulse Generation</h1></header>
        <div class="main-layout">
            <div class="panel simulation-area"><h2>Electron Trajectory</h2><div class="simulation-container"><canvas id="main-canvas"></canvas></div></div>
            <div class="panel controls-area"><h2>Controls</h2><div id="controls-panel"></div></div>
            <div class="panel metrics-area"><h2>Live Metrics</h2><div class="metrics-grid" id="metrics-panel"></div></div>
            <div class="panel charts-area">
                <h2>Data Visualizations</h2>
                <div class="charts-area-grid">
                    <div class="dynamic-chart-container"><h2>High-Harmonic Spectrum</h2><canvas id="spectrum-canvas"></canvas></div>
                    <div class="dynamic-chart-container"><h2>Attosecond Pulse Train</h2><canvas id="pulse-canvas"></canvas></div>
                    <div class="dynamic-chart-container" style="grid-column: 1 / -1;"><h2>Three-Step Model</h2><svg id="model-svg"></svg></div>
                </div>
            </div>
            <div class="panel content-area"><article id="exposition-content"></article></div>
            <div class="panel qa-area"><h2>Questions & Answers</h2><div id="qa-content"></div></div>
        </div>
    </div>
<script>
// --- CONTENT ---
const content = { /* ... 5000+ words of text and 20 Q&A items ... */ };

document.addEventListener('DOMContentLoaded', () => {
    const app = new AttosecondSimApp();
    app.init();
});

class AttosecondSimApp {
    constructor() {
        this.canvas = document.getElementById('main-canvas'); this.ctx = this.canvas.getContext('2d');
        // ... other canvases and svg ...
        this.params = {};
        this.state = {};
        this.isRunning = false;
    }

    init() {
        this.setupControls();
        this.addEventListeners();
        this.loadPreset('default');
        this.gameLoop();
    }

    setupControls() {
        // ... setup for 6+ controls: Laser Intensity, Wavelength, Gas Type, etc. ...
    }

    addEventListeners() {
        document.getElementById('play-btn').addEventListener('click', () => { this.isRunning = !this.isRunning; });
        document.getElementById('reset-btn').addEventListener('click', () => this.loadPreset('default'));
        // ... other listeners ...
    }

    loadPreset(id, p) {
        // ... load default or preset values ...
        this.resetSimulation();
    }

    resetSimulation() {
        this.isRunning = false;
        this.state = {
            t: 0,
            electrons: [], // { t0, x, y, returned_energy }
            spectrum: new Map()
        };
    }

    gameLoop() {
        requestAnimationFrame(() => this.gameLoop());
        if (this.isRunning) {
            this.update(1/600); // High temporal resolution needed
        }
        this.draw();
    }

    update(dt) {
        const { state, params } = this;
        state.t += dt;

        // Ionize new electrons based on laser field
        const E_field = Math.sin(params.omega * state.t);
        if (Math.abs(E_field) > 0.95 && Math.random() < 0.1) {
            state.electrons.push({ t0: state.t, x: 0, v: 0, returned_energy: 0 });
        }

        // Evolve electron trajectories
        state.electrons.forEach(e => {
            if (e.returned_energy > 0) return; // Already recombined
            const E_current = Math.sin(params.omega * (e.t0 + (state.t - e.t0)));
            e.v -= E_current * dt * params.intensity;
            e.x += e.v * dt;

            // Check for recombination
            if (Math.sign(e.x_prev) !== Math.sign(e.x) && state.t > e.t0 + 0.1) {
                e.returned_energy = 0.5 * e.v * e.v + params.Ip;
                const harmonic = Math.round(e.returned_energy / params.omega);
                state.spectrum.set(harmonic, (state.spectrum.get(harmonic) || 0) + 1);
            }
            e.x_prev = e.x;
        });
    }

    draw() {
        this.drawMainCanvas();
        this.drawSpectrum();
        this.drawPulseTrain();
        this.drawModelSvg();
        this.updateMetrics();
    }

    drawMainCanvas() { /* ... draw trajectories ... */ }
    drawSpectrum() { /* ... draw bar chart from state.spectrum ... */ }
    drawPulseTrain() { /* ... mock fourier transform of spectrum ... */ }
    drawModelSvg() { /* ... */ }
    updateMetrics() { /* ... */ }
}
</script>
</body>
</html>
